<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TradeX AI"/>
<title>TradeX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a0e1a;--surface:#111827;--card:#161d2e;--border:#1e2d45;--accent:#00d4ff;--green:#00e676;--red:#ff4757;--yellow:#ffd600;--text:#e8f0fe;--muted:#5c7a9e;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.mono{font-family:'Space Mono',monospace;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--green)}50%{box-shadow:0 0 20px var(--green)}}
.header{border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0057ff);display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.logo-sub{font-size:10px;color:var(--muted);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1s infinite;display:inline-block;margin-right:4px;}
.header-stats{display:flex;gap:14px;align-items:center;}
.stat{text-align:right;}
.stat-label{font-size:10px;color:var(--muted);}
.stat-val{font-size:13px;font-weight:700;}
.ticker-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 0;}
.ticker-inner{display:flex;gap:10px;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
.ticker-inner::-webkit-scrollbar{display:none;}
.tick{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);white-space:nowrap;flex-shrink:0;cursor:pointer;transition:border 0.2s;}
.tick:hover{border-color:var(--accent);}
.tick-sym{font-size:12px;font-weight:700;color:var(--accent);}
.tick-price{font-size:12px;color:var(--text);}
.tick-chg{font-size:11px;}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;background:var(--bg);position:sticky;top:62px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all 0.2s;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-sub{font-size:9px;display:block;opacity:0.7;}
.content{padding:16px;max-width:600px;margin:0 auto;animation:fadeIn 0.3s ease;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.section-title{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}
.search-row{display:flex;gap:8px;margin-bottom:16px;}
.search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
.search-input::placeholder{color:var(--muted);}
.scan-btn{background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:10px 16px;color:#fff;font-weight:700;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;white-space:nowrap;}
.scan-btn:disabled{opacity:0.5;}
.signal-card{border-radius:12px;padding:16px;margin-bottom:12px;animation:fadeIn 0.4s ease;}
.signal-card.buy{background:var(--card);border:1px solid var(--green);box-shadow:0 0 20px rgba(0,230,118,0.1);}
.signal-card.sell{background:var(--card);border:1px solid var(--red);box-shadow:0 0 20px rgba(255,71,87,0.1);}
.signal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.signal-left{display:flex;align-items:center;gap:10px;}
.signal-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
.signal-badge.buy{background:rgba(0,230,118,0.15);color:var(--green);}
.signal-badge.sell{background:rgba(255,71,87,0.15);color:var(--red);}
.signal-sym{font-size:18px;font-weight:700;color:var(--accent);}
.close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;}
.signal-levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.level{background:var(--surface);border-radius:8px;padding:10px;}
.level-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.level-val{font-size:14px;font-weight:700;}
.signal-reason{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin-bottom:8px;}
.signal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tag{background:rgba(0,212,255,0.1);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px;}
.signal-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
.live-badge{background:rgba(0,230,118,0.15);color:var(--green);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-box-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.stat-box-val{font-size:17px;font-weight:700;}
.bot-control{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:16px;transition:border 0.3s;}
.bot-status{display:flex;align-items:center;gap:10px;}
.bot-dot{width:10px;height:10px;border-radius:50%;}
.bot-dot.running{background:var(--green);animation:pulse 1s infinite,glow 2s infinite;}
.bot-dot.stopped{background:var(--muted);}
.bot-name{font-size:14px;font-weight:600;}
.bot-desc{font-size:11px;color:var(--muted);}
.bot-btn{border-radius:8px;padding:8px 18px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;transition:all 0.2s;border:1px solid;}
.bot-btn.start{background:rgba(0,230,118,0.1);border-color:var(--green);color:var(--green);}
.bot-btn.stop{background:rgba(255,71,87,0.1);border-color:var(--red);color:var(--red);}
.log-box{background:#070b14;border:1px solid var(--border);border-radius:8px;height:160px;overflow-y:auto;padding:10px;font-family:'Space Mono',monospace;font-size:11px;margin-bottom:16px;}
.log-box::-webkit-scrollbar{width:3px;}
.log-box::-webkit-scrollbar-thumb{background:var(--border);}
.log-line{margin-bottom:4px;line-height:1.5;}
.log-time{color:var(--border);}
.trade-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:12px;}
.trade-action{font-weight:700;width:38px;}
.trade-sym{color:var(--accent);font-weight:700;width:55px;}
.trade-info{color:var(--muted);flex:1;}
.trade-pnl{font-weight:700;font-size:12px;}
.empty{text-align:center;padding:50px 20px;border:1px dashed var(--border);border-radius:12px;}
.empty-icon{font-size:32px;margin-bottom:12px;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--muted);}
.warning{border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:10px;}
.warning.yellow{background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);color:var(--yellow);}
.warning.blue{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);color:var(--accent);}
.warning.green{background:rgba(0,230,118,0.06);border:1px solid rgba(0,230,118,0.2);color:var(--green);}
.loading{text-align:center;padding:40px;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
.risk-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Space Mono',monospace;outline:none;margin-bottom:10px;}
.risk-result{background:var(--surface);border-radius:10px;padding:14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.risk-item{text-align:center;}
.risk-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.risk-val{font-size:16px;font-weight:700;color:var(--accent);}
.fg-meter{position:relative;height:12px;border-radius:6px;background:linear-gradient(to right,#ff4757,#ffd600,#00e676);margin:16px 0;}
.fg-needle{position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:white;border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,0.5);transform:translateX(-50%);transition:left 1s ease;}
.fg-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px;}
.sector-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;}
.sector-name{flex:1;font-size:13px;font-weight:600;}
.sector-bar-wrap{width:80px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.sector-bar{height:100%;border-radius:3px;transition:width 0.8s ease;}
.sector-chg{font-size:12px;font-weight:700;width:45px;text-align:right;}
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:12px;}
.hist-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.hist-badge.buy{background:rgba(0,230,118,0.15);color:var(--green);}
.hist-badge.sell{background:rgba(255,71,87,0.15);color:var(--red);}
.wl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.wl-box{background:var(--surface);border-radius:10px;padding:14px;text-align:center;}
.wl-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.wl-val{font-size:20px;font-weight:700;}
.wl-bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:12px 0 6px;}
.wl-bar{height:100%;background:linear-gradient(to right,var(--green),var(--accent));border-radius:4px;transition:width 0.8s ease;}
/* NEWS */
.news-row{padding:12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;}
.news-headline{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.4;}
.news-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted);}
.news-sentiment{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.news-sentiment.positive{background:rgba(0,230,118,0.15);color:var(--green);}
.news-sentiment.negative{background:rgba(255,71,87,0.15);color:var(--red);}
.news-sentiment.neutral{background:rgba(255,214,0,0.15);color:var(--yellow);}
/* INDICATORS */
.ind-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.ind-box{background:var(--surface);border-radius:8px;padding:12px;}
.ind-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.ind-val{font-size:16px;font-weight:700;}
.ind-signal{font-size:10px;margin-top:2px;}
/* STOCK DETAIL */
.stock-detail{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;animation:fadeIn 0.3s ease;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CLAUDE_API = "https://api.anthropic.com/v1/messages";
const POLYGON_KEY = "0ALkLfbzvxUnKNycJTqal0uGK0dj4gJf";
const POLYGON = "https://api.polygon.io";
const TICKERS = ["AAPL","TSLA","NVDA","MSFT","AMZN","META","GOOGL","AMD","SOFI","PLTR","SPY","QQQ"];

// NOTIFICATIONS
let notifPermission = "default";
async function requestNotifications() {
  if (!("Notification" in window)) { alert("Use Safari from your home screen for notifications."); return; }
  const result = await Notification.requestPermission();
  notifPermission = result;
  if (result === "granted") { scheduleDailyReminder(); showNotif("🚀 TradeX AI", "Notifications enabled!"); }
  else alert("Go to iPhone Settings → Safari → Notifications to allow TradeX AI.");
  render();
}
function showNotif(title, body) {
  if (notifPermission !== "granted") return;
  try { new Notification(title, { body }); } catch(e) {}
}
function scheduleDailyReminder() {
  const now = new Date(), next9am = new Date();
  next9am.setHours(9,0,0,0);
  if (now >= next9am) next9am.setDate(next9am.getDate()+1);
  setTimeout(() => {
    showNotif("📈 Good morning!", "Time to scan for today's trading signals.");
    setInterval(() => showNotif("📈 Good morning!", "Time to scan for today's trading signals."), 86400000);
  }, next9am - now);
}
if ("Notification" in window) { notifPermission = Notification.permission; if (notifPermission === "granted") scheduleDailyReminder(); }

// STATE
let state = {
  tab: "signals",
  signals: [], signalHistory: [],
  loading: false, scanQuery: "",
  portfolio: { balance: 1000, pnl: 0, trades: [] },
  botRunning: false, botLog: [], botInterval: null,
  tickers: [], tickerInterval: null,
  riskAccount:"", riskEntry:"", riskStop:"", riskPercent:"2",
  fearGreed: null, fgLoading: false,
  sectors: [], sectorLoading: false,
  news: [], newsLoading: false,
  selectedStock: null, stockDetail: null, stockLoading: false,
  lastPriceUpdate: null,
};

// ── LIVE PRICES (Polygon) ──────────────────────────────────
async function fetchLivePrices() {
  try {
    const symbols = TICKERS.join(",");
    const res = await fetch(`${POLYGON}/v2/snapshot/locale/us/markets/stocks/tickers?tickers=${symbols}&apiKey=${POLYGON_KEY}`);
    const data = await res.json();
    if (data.tickers && data.tickers.length) {
      state.tickers = data.tickers.map(t => ({
        symbol: t.ticker,
        price: t.day?.c?.toFixed(2) || t.prevDay?.c?.toFixed(2) || "—",
        change: t.todaysChangePerc?.toFixed(2) || "0.00",
        volume: t.day?.v ? (t.day.v/1000000).toFixed(1)+"M" : "—",
        open: t.day?.o?.toFixed(2) || "—",
        high: t.day?.h?.toFixed(2) || "—",
        low: t.day?.l?.toFixed(2) || "—",
      }));
      state.lastPriceUpdate = new Date().toLocaleTimeString();
      render();
    }
  } catch(e) {
    // fallback to mock if API fails
    if (!state.tickers.length) {
      state.tickers = TICKERS.map(s => ({ symbol:s, price:(Math.random()*400+50).toFixed(2), change:(Math.random()*6-3).toFixed(2), volume:"—", open:"—", high:"—", low:"—" }));
    }
  }
}

async function fetchStockDetail(symbol) {
  state.selectedStock = symbol;
  state.stockLoading = true;
  state.tab = "stockdetail";
  render();
  try {
    // Get snapshot
    const [snapRes, newsRes] = await Promise.all([
      fetch(`${POLYGON}/v2/snapshot/locale/us/markets/stocks/tickers/${symbol}?apiKey=${POLYGON_KEY}`),
      fetch(`${POLYGON}/v2/reference/news?ticker=${symbol}&limit=5&apiKey=${POLYGON_KEY}`)
    ]);
    const snapData = await snapRes.json();
    const newsData = await newsRes.json();
    const t = snapData.ticker;
    // Calculate basic indicators from available data
    const price = t?.day?.c || t?.prevDay?.c || 0;
    const open = t?.day?.o || price;
    const high = t?.day?.h || price;
    const low = t?.day?.l || price;
    const prevClose = t?.prevDay?.c || price;
    const change = t?.todaysChangePerc || 0;
    const volume = t?.day?.v || 0;
    const avgVol = t?.prevDay?.v || volume;
    // Derived indicators
    const relVolume = avgVol > 0 ? (volume/avgVol).toFixed(2) : "—";
    const dayRange = high - low;
    const position = dayRange > 0 ? ((price - low)/dayRange*100).toFixed(0) : 50;
    state.stockDetail = {
      symbol, price: price.toFixed(2), open: open.toFixed(2),
      high: high.toFixed(2), low: low.toFixed(2),
      prevClose: prevClose.toFixed(2), change: change.toFixed(2),
      volume: (volume/1000000).toFixed(2)+"M", relVolume,
      position, // % position in day range
      news: (newsData.results||[]).slice(0,4).map(n => ({
        title: n.title, source: n.publisher?.name || "News",
        date: new Date(n.published_utc).toLocaleDateString(),
        url: n.article_url,
      }))
    };
  } catch(e) {
    state.stockDetail = { symbol, error: "Could not load live data. Market may be closed." };
  }
  state.stockLoading = false;
  render();
}

// ── NEWS SENTIMENT ─────────────────────────────────────────
async function fetchMarketNews() {
  state.newsLoading = true; render();
  try {
    const res = await fetch(`${POLYGON}/v2/reference/news?limit=10&apiKey=${POLYGON_KEY}`);
    const data = await res.json();
    const headlines = (data.results||[]).slice(0,8).map(n => n.title);
    if (!headlines.length) throw new Error("No news");
    // Send to Claude for sentiment analysis
    const claudeRes = await fetch(CLAUDE_API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:600,
        system:`Analyze these stock market news headlines and return ONLY a JSON array. No markdown.
Each object: {"title":string(shortened to 80 chars max),"sentiment":"positive"|"negative"|"neutral","impact":"HIGH"|"MEDIUM"|"LOW","ticker":string(affected ticker or "MARKET")}`,
        messages:[{role:"user",content:`Analyze sentiment: ${JSON.stringify(headlines)}`}]
      })
    });
    const cd = await claudeRes.json();
    const text = (cd.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    state.news = JSON.parse(text);
  } catch(e) {
    state.news = [
      {title:"Fed signals potential rate pause amid inflation data",sentiment:"positive",impact:"HIGH",ticker:"MARKET"},
      {title:"NVIDIA reports record GPU demand from AI companies",sentiment:"positive",impact:"HIGH",ticker:"NVDA"},
      {title:"Tesla faces increased competition in EV market",sentiment:"negative",impact:"MEDIUM",ticker:"TSLA"},
      {title:"Apple iPhone sales beat analyst expectations",sentiment:"positive",impact:"MEDIUM",ticker:"AAPL"},
    ];
  }
  state.newsLoading = false; render();
}

// ── SCAN WITH LIVE DATA ────────────────────────────────────
async function scanSignals() {
  if (state.loading) return;
  state.loading = true; state.signals = []; render();

  // Get live prices for context
  const livePrices = state.tickers.slice(0,8).map(t => `${t.symbol}: $${t.price} (${t.change}%)`).join(", ");

  try {
    const res = await fetch(CLAUDE_API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1200,
        system:`You are an expert stock trading analyst for day and swing trading.
You have access to LIVE market data. Use these current prices in your analysis.
Return ONLY a valid JSON array of exactly 3 trade signals. No markdown.
Each object: symbol, action (BUY or SELL), entry (number - use the live price provided), target (number), stopLoss (number), confidence (0-100), timeframe (string), reasoning (string - mention the live price), indicators (array of strings), rsi (number 0-100), macd (string: "Bullish"/"Bearish"/"Neutral"), volumeSignal (string).`,
        messages:[{role:"user",content:`LIVE PRICES RIGHT NOW: ${livePrices}\n\nUser query: ${state.scanQuery.trim()||"Find the top 3 best short-term trading opportunities based on these live prices. Use the actual current prices for entry points."}`}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    state.signals = JSON.parse(text);
    const ts = new Date().toLocaleTimeString();
    state.signalHistory = [...state.signals.map(s=>({...s,scannedAt:ts})), ...state.signalHistory].slice(0,20);
  } catch(e) {
    // Use live prices in fallback
    const nvdaPrice = state.tickers.find(t=>t.symbol==="NVDA")?.price || "924.50";
    const tslaPrice = state.tickers.find(t=>t.symbol==="TSLA")?.price || "247.80";
    const metaPrice = state.tickers.find(t=>t.symbol==="META")?.price || "512.30";
    state.signals = [
      {symbol:"NVDA",action:"BUY",entry:parseFloat(nvdaPrice),target:+(parseFloat(nvdaPrice)*1.035).toFixed(2),stopLoss:+(parseFloat(nvdaPrice)*0.985).toFixed(2),confidence:82,timeframe:"1-2 days",reasoning:`Live price $${nvdaPrice}. Strong momentum breakout with high relative volume. GPU demand narrative intact.`,indicators:["RSI 62","MACD Bullish","Vol Surge"],rsi:62,macd:"Bullish",volumeSignal:"Above Average"},

// ── TIER 2: MARKET HOURS ──────────────────────────────────
function isMarketOpen() {
  const now = new Date();
  const est = new Date(now.toLocaleString("en-US", {timeZone:"America/New_York"}));
  const day = est.getDay(); // 0=Sun, 6=Sat
  if (day === 0 || day === 6) return { open: false, reason: "Market closed — weekend" };
  const hours = est.getHours(), mins = est.getMinutes();
  const totalMins = hours * 60 + mins;
  const marketOpen = 9 * 60 + 30;   // 9:30 AM
  const avoidOpen = 10 * 60;         // 10:00 AM (avoid first 30min)
  const avoidClose = 15 * 60 + 30;   // 3:30 PM (avoid last 30min)
  const marketClose = 16 * 60;       // 4:00 PM
  if (totalMins < marketOpen) return { open: false, reason: `Market opens at 9:30 AM EST (${Math.round((marketOpen-totalMins))}min away)` };
  if (totalMins < avoidOpen) return { open: false, reason: "Avoiding first 30min — high volatility window" };
  if (totalMins >= avoidClose) return { open: false, reason: "Avoiding last 30min — closing volatility window" };
  if (totalMins >= marketClose) return { open: false, reason: "Market closed for today" };
  return { open: true, reason: "Market open — trading window active" };
}

// ── TIER 2: SMART POSITION SIZING ─────────────────────────
function smartPositionSize(entryPrice, stopLossPrice) {
  const balance = state.portfolio.balance;
  const riskPct = 0.02; // Risk 2% per trade
  const dollarRisk = balance * riskPct;
  const riskPerShare = entryPrice - stopLossPrice;
  if (riskPerShare <= 0) return 1;
  const shares = Math.max(1, Math.floor(dollarRisk / riskPerShare));
  const maxCost = balance * 0.15; // Never more than 15% of balance in one trade
  const maxShares = Math.floor(maxCost / entryPrice);
  return Math.min(shares, maxShares);
}

// ── TIER 2: AUTO STOP-LOSS MONITOR ────────────────────────
function checkStopLosses() {
  const openTrades = state.portfolio.trades.filter(t => t.exitPrice === null && t.stopLoss);
  if (!openTrades.length) return;
  openTrades.forEach(trade => {
    const currentTicker = state.tickers.find(t => t.symbol === trade.symbol);
    if (!currentTicker) return;
    const currentPrice = parseFloat(currentTicker.price);
    const stopLoss = parseFloat(trade.stopLoss);
    if (currentPrice <= stopLoss) {
      // STOP LOSS TRIGGERED
      const pnl = +((currentPrice - trade.entryPrice) * trade.shares).toFixed(2);
      state.portfolio.balance += trade.shares * currentPrice;
      state.portfolio.pnl += pnl;
      const idx = state.portfolio.trades.findIndex(t => t.id === trade.id);
      if (idx !== -1) state.portfolio.trades[idx].exitPrice = currentPrice;
      addLog(`🛑 STOP LOSS HIT: ${trade.symbol} @ $${currentPrice} | Loss: $${pnl}`, "error");
      showNotif(`🛑 Stop Loss: ${trade.symbol}`, `Exited @ $${currentPrice} | Loss: $${pnl}`);
      render();
    }
  });
}

async function botCycle() {
  // TIER 2: Check stop losses first on every cycle
  checkStopLosses();

  // TIER 2: Market hours check
  const marketStatus = isMarketOpen();
  if (!marketStatus.open) {
    addLog(`🕐 ${marketStatus.reason}`, "warn");
    return;
  }

  addLog("🔍 Fetching live prices...", "info");
  await fetchLivePrices();
  const livePrices = state.tickers.slice(0,6).map(t=>`${t.symbol}:$${t.price}(${t.change}%)`).join(",");
  addLog(`📡 Live: ${livePrices.substring(0,60)}...`, "info");

  try {
    const res = await fetch(CLAUDE_API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:300,
        system:`Automated paper trading bot with LIVE market data. Return ONLY JSON, no markdown.
LIVE PRICES: ${livePrices}
Format: {"action":"BUY","symbol":"TICKER","entryPrice":number,"stopLoss":number,"reason":"brief"} or {"action":"HOLD","reason":"brief"}
IMPORTANT: Always include a stopLoss price (typically 1.5-2% below entry for day trades).
Use actual live prices. Balance: $${state.portfolio.balance.toFixed(2)}`,
        messages:[{role:"user",content:"One trade decision based on live prices. Include stopLoss. JSON only."}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    const d = JSON.parse(text);
    if (d.action==="HOLD") { addLog(`⏸ HOLD — ${d.reason}`,"info"); return; }

    // TIER 2: Smart position sizing
    const stopLoss = d.stopLoss || d.entryPrice * 0.985;
    const shares = smartPositionSize(d.entryPrice, stopLoss);
    const cost = shares * d.entryPrice;

    if (cost > state.portfolio.balance) { addLog(`⚠️ Insufficient funds for ${d.symbol}`,"warn"); return; }
    state.portfolio.balance -= cost;
    const trade = {...d, shares, stopLoss, id:Date.now(), exitPrice:null};
    state.portfolio.trades.push(trade);
    addLog(`✅ BUY ${shares}x ${d.symbol} @ $${d.entryPrice} | Stop: $${stopLoss.toFixed(2)} | 2% risk rule`, "trade");
    showNotif(`🤖 Bot: BUY ${d.symbol}`, `${shares} shares @ $${d.entryPrice} | Stop $${stopLoss.toFixed(2)}`);
    render();

    setTimeout(async () => {
      await fetchLivePrices();
      const updatedTicker = state.tickers.find(t=>t.symbol===d.symbol);
      const liveExit = updatedTicker ? parseFloat(updatedTicker.price) : d.entryPrice;
      const exit = +(liveExit * (1 + (Math.random()*0.03-0.01))).toFixed(2);
      const pnl = +((exit-d.entryPrice)*shares).toFixed(2);
      state.portfolio.balance += shares * exit;
      state.portfolio.pnl += pnl;
      const idx = state.portfolio.trades.findIndex(t=>t.id===trade.id);
      if (idx!==-1) state.portfolio.trades[idx].exitPrice = exit;
      addLog(`📤 CLOSED ${d.symbol} @ $${exit} | P&L: ${pnl>=0?"+":""}$${pnl}`, pnl>=0?"success":"error");
      showNotif(`📤 Bot Closed ${d.symbol}`, `P&L: ${pnl>=0?"+":""}$${pnl}`);
      render();
    }, 10000+Math.random()*15000);
  } catch(e) { addLog(`⚠️ Error: ${e.message || JSON.stringify(e)}`, "error"); }
}

function toggleBot() {

function addLog(msg, type="info") {

  state.botLog.push({msg,color:colors[type],time:new Date().toLocaleTimeString()});

function getStats() {
  const closed=state.portfolio.trades.filter(t=>t.exitPrice!==null);
  if(!closed.length) return null;
  const wins=closed.filter(t=>(t.exitPrice-t.entryPrice)*t.shares>0);
  const losses=closed.filter(t=>(t.exitPrice-t.entryPrice)*t.shares<=0);
  const winRate=Math.round(wins.length/closed.length*100);
  const avgWin=wins.length?(wins.reduce((s,t)=>s+(t.exitPrice-t.entryPrice)*t.shares,0)/wins.length).toFixed(2):0;
  const avgLoss=losses.length?(losses.reduce((s,t)=>s+(t.exitPrice-t.entryPrice)*t.shares,0)/losses.length).toFixed(2):0;
  const best=closed.reduce((b,t)=>{const p=(t.exitPrice-t.entryPrice)*t.shares;return p>b?p:b;},-Infinity).toFixed(2);
  const worst=closed.reduce((b,t)=>{const p=(t.exitPrice-t.entryPrice)*t.shares;return p<b?p:b;},Infinity).toFixed(2);
  return{total:closed.length,wins:wins.length,losses:losses.length,winRate,avgWin,avgLoss,best,worst};
}

function calcRisk() {
  const account=parseFloat(state.riskAccount),entry=parseFloat(state.riskEntry),stop=parseFloat(state.riskStop),pct=parseFloat(state.riskPercent)/100;
  if(!account||!entry||!stop||entry<=stop) return null;
  const riskPerShare=entry-stop,dollarRisk=account*pct,shares=Math.floor(dollarRisk/riskPerShare);
  return{shares,positionSize:(shares*entry).toFixed(2),maxLoss:(shares*riskPerShare).toFixed(2),riskPerShare:riskPerShare.toFixed(2)};
}

  const newsHTML=state.newsLoading
    ?`<div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px">Fetching live news & analyzing sentiment...</div></div>`
    :!state.news.length
    ?`<button onclick="fetchMarketNews()" style="background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:12px;color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:13px">📰 Load Live News</button>`
    :state.news.map(n=>`<div class="news-row">
        <div class="news-headline">${n.title}</div>
        <div class="news-meta">
          <span class="news-sentiment ${n.sentiment}">${n.sentiment==="positive"?"📈 Bullish":n.sentiment==="negative"?"📉 Bearish":"➡️ Neutral"}</span>
          <span>Impact: <strong style="color:${n.impact==="HIGH"?"var(--red)":n.impact==="MEDIUM"?"var(--yellow)":"var(--muted)"}">${n.impact}</strong></span>
          ${n.ticker!=="MARKET"?`<span style="color:var(--accent);font-weight:700">${n.ticker}</span>`:""}
        </div>
      </div>`).join("")+`<button onclick="fetchMarketNews()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:12px;cursor:pointer;width:100%;margin-top:4px">🔄 Refresh News</button>`;

  const tradesHTML=!state.portfolio.trades.length?"":
    `<div class="section-title">Trade History</div>`+
    state.portfolio.trades.slice(-8).reverse().map(t=>{
      const pnl=t.exitPrice?((t.exitPrice-t.entryPrice)*t.shares).toFixed(2):null;
      return `<div class="trade-row">
        <span class="trade-action mono" style="color:${t.action==="BUY"?"var(--green)":"var(--red)"}">${t.action}</span>
        <span class="trade-sym mono">${t.symbol}</span>
        <span class="trade-info">${t.shares}x @ $${t.entryPrice}</span>
        ${pnl!==null?`<span class="trade-pnl mono" style="color:${pnl>=0?"var(--green)":"var(--red)"}">${pnl>=0?"+":""}$${pnl}</span>`:`<span style="color:var(--yellow);font-size:11px">OPEN</span>`}
      </div>`;
    }).join("");

  // Stock Detail
  const sdHTML = state.stockLoading
    ? `<div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px">Loading live data for ${state.selectedStock}...</div></div>`
    : state.stockDetail ? `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px">
        <button onclick="state.tab='signals';render()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text);font-size:12px;cursor:pointer">← Back</button>
        <span style="font-size:20px;font-weight:700;color:var(--accent)">${state.stockDetail.symbol}</span>
        <span class="live-badge">LIVE</span>
      </div>
      ${state.stockDetail.error ? `<div class="warning yellow">${state.stockDetail.error}</div>` : `
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-label">Price</div><div class="stat-box-val mono">$${state.stockDetail.price}</div></div>
        <div class="stat-box"><div class="stat-box-label">Change</div><div class="stat-box-val mono" style="color:${parseFloat(state.stockDetail.change)>=0?"var(--green)":"var(--red)"}">${parseFloat(state.stockDetail.change)>=0?"+":""}${state.stockDetail.change}%</div></div>
        <div class="stat-box"><div class="stat-box-label">Volume</div><div class="stat-box-val mono" style="font-size:14px">${state.stockDetail.volume}</div></div>
      </div>
      <div class="card">
        <div class="section-title">Day Range</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:var(--muted)"><span>Low: <span class="mono" style="color:var(--red)">$${state.stockDetail.low}</span></span><span>High: <span class="mono" style="color:var(--green)">$${state.stockDetail.high}</span></span></div>
        <div style="height:8px;background:var(--border);border-radius:4px;overflow:hidden"><div style="height:100%;width:${state.stockDetail.position}%;background:linear-gradient(to right,var(--red),var(--yellow),var(--green));border-radius:4px"></div></div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px;text-align:center">Price position in today's range: ${state.stockDetail.position}%</div>
      </div>
      <div class="card">
        <div class="section-title">Key Levels</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <div class="wl-box"><div class="wl-label">Open</div><div class="wl-val" style="font-size:16px">$${state.stockDetail.open}</div></div>
          <div class="wl-box"><div class="wl-label">Prev Close</div><div class="wl-val" style="font-size:16px">$${state.stockDetail.prevClose}</div></div>
          <div class="wl-box"><div class="wl-label">Rel Volume</div><div class="wl-val" style="font-size:16px;color:${parseFloat(state.stockDetail.relVolume)>1.5?"var(--green)":parseFloat(state.stockDetail.relVolume)<0.7?"var(--red)":"var(--text)"}">${state.stockDetail.relVolume}x</div></div>
          <div class="wl-box"><div class="wl-label">Day Range %</div><div class="wl-val" style="font-size:16px">${(((state.stockDetail.high-state.stockDetail.low)/state.stockDetail.low)*100).toFixed(1)}%</div></div>
        </div>
      </div>
      ${state.stockDetail.news?.length?`<div class="card"><div class="section-title">Latest News</div>${state.stockDetail.news.map(n=>`<div class="news-row"><div class="news-headline">${n.title}</div><div class="news-meta"><span>${n.source}</span><span>${n.date}</span></div></div>`).join("")}</div>`:""}
      <button onclick="state.scanQuery='Analyze ${state.stockDetail.symbol} specifically';scanSignals();state.tab='signals';render()" style="background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:12px;color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:13px;margin-top:4px">⚡ Get AI Signal for ${state.stockDetail.symbol}</button>
      `}` : "";

  document.getElementById("app").innerHTML=`
    <div class="header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div><div class="logo-text mono">TRADEX AI</div><div class="logo-sub"><span class="live-dot"></span>LIVE DATA${state.lastPriceUpdate?` · ${state.lastPriceUpdate}`:""}</div></div>
      </div>
      <div class="header-stats">
        <div class="stat"><div class="stat-label">Balance</div><div class="stat-val mono">$${state.portfolio.balance.toFixed(2)}</div></div>
        <div class="stat"><div class="stat-label">P&L</div><div class="stat-val mono" style="color:${pnlColor}">${state.portfolio.pnl>=0?"+":""}$${state.portfolio.pnl.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="ticker-wrap"><div class="ticker-inner">${tickersHTML}</div></div>
    <div class="tabs">
      <button class="tab ${state.tab==="signals"?"active":""}" onclick="switchTab('signals')">📡 Signals<span class="tab-sub">Live Data</span></button>
      <button class="tab ${state.tab==="bot"?"active":""}" onclick="switchTab('bot')">🤖 Bot<span class="tab-sub">Paper</span></button>
      <button class="tab ${state.tab==="news"?"active":""}" onclick="switchTab('news')">📰 News<span class="tab-sub">Sentiment</span></button>
      <button class="tab ${state.tab==="stats"?"active":""}" onclick="switchTab('stats')">📊 Stats<span class="tab-sub">Win/Loss</span></button>
      <button class="tab ${state.tab==="risk"?"active":""}" onclick="switchTab('risk')">🧮 Risk<span class="tab-sub">Calculator</span></button>
      <button class="tab ${state.tab==="market"?"active":""}" onclick="switchTab('market')">🌡️ Market<span class="tab-sub">Fear/Greed</span></button>
      ${state.tab==="stockdetail"?`<button class="tab active">${state.selectedStock}<span class="tab-sub">Detail</span></button>`:""}
    </div>

    ${state.tab==="signals"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">AI Trading Signals</div><div style="color:var(--muted);font-size:13px">Using <span style="color:var(--green)">live prices</span> from Polygon. Tap any ticker above for details.</div></div>
      <div class="search-row"><input class="search-input" placeholder="e.g. 'Tech momentum plays' or leave blank..." value="${state.scanQuery}" oninput="state.scanQuery=this.value" onkeydown="if(event.key==='Enter')scanSignals()"/><button class="scan-btn" onclick="scanSignals()" ${state.loading?"disabled":""}>⚡ Scan</button></div>
      ${signalsHTML}
      ${state.signalHistory.length?`<div style="margin-top:20px"><div class="section-title">Signal History</div>${histHTML}</div>`:""}
    </div>`:""}

    ${state.tab==="bot"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">Paper Trading Bot</div><div style="color:var(--muted);font-size:13px">Now using <span style="color:var(--green)">live prices</span> for all trades.</div></div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-label">Balance</div><div class="stat-box-val mono">$${state.portfolio.balance.toFixed(0)}</div></div>
        <div class="stat-box"><div class="stat-box-label">P&L</div><div class="stat-box-val mono" style="color:${pnlColor}">${state.portfolio.pnl>=0?"+":""}$${state.portfolio.pnl.toFixed(2)}</div></div>
        <div class="stat-box"><div class="stat-box-label">Trades</div><div class="stat-box-val mono" style="color:var(--accent)">${state.portfolio.trades.length}</div></div>
      </div>
      ${(()=>{ const ms=isMarketOpen(); return `<div style="background:${ms.open?"rgba(0,230,118,0.08)":"rgba(255,71,87,0.08)"};border:1px solid ${ms.open?"rgba(0,230,118,0.3)":"rgba(255,71,87,0.3)"};border-radius:8px;padding:10px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;font-size:12px"><span style="font-size:16px">${ms.open?"🟢":"🔴"}</span><span style="color:${ms.open?"var(--green)":"var(--red)"};font-weight:600">${ms.open?"Market Open — Trading Active":"Market Closed"}</span><span style="color:var(--muted)">${ms.reason}</span></div>`; })()}
      <div class="bot-control" style="border:1px solid ${state.botRunning?"var(--green)":"var(--border)"}">
        <div class="bot-status"><div class="bot-dot ${state.botRunning?"running":"stopped"}"></div><div><div class="bot-name">${state.botRunning?"Bot Running (Live)":"Bot Stopped"}</div><div class="bot-desc">${state.botRunning?"Smart sizing · Auto stop-loss · Market hours":"Tap Start to begin"}</div></div></div>
        <button class="bot-btn ${state.botRunning?"stop":"start"}" onclick="toggleBot()">${state.botRunning?"⏹ Stop":"▶ Start"}</button>
      </div>
      <div class="section-title">Live Bot Log</div>
      <div class="log-box" id="logbox">${state.botLog.length?state.botLog.map(l=>`<div class="log-line"><span class="log-time">[${l.time}] </span><span style="color:${l.color}">${l.msg}</span></div>`).join(""):`<span style="color:var(--muted)">Waiting for bot to start...</span>`}</div>
      ${tradesHTML}
      <div style="margin-top:12px">
        ${notifPermission==="granted"?`<div class="warning green">🔔 Notifications active!</div>`:`<div style="background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px"><div style="font-size:12px;color:var(--yellow)">🔔 Enable bot trade alerts</div><button onclick="requestNotifications()" style="background:var(--yellow);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer">Enable</button></div>`}
      </div>
      <div class="warning blue" style="margin-top:8px">ℹ️ Paper trading only — no real money used.</div>
    </div>`:""}

    ${state.tab==="news"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">📰 News Sentiment</div><div style="color:var(--muted);font-size:13px">Live market news analyzed by AI for trading impact.</div></div>
      ${newsHTML}
    </div>`:""}

    ${state.tab==="stats"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">📊 Win/Loss Stats</div><div style="color:var(--muted);font-size:13px">Your bot's performance breakdown.</div></div>
      ${wlHTML}
      <div style="margin-top:20px"><div class="section-title">Signal History</div>${histHTML}</div>
    </div>`:""}

    ${state.tab==="risk"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">🧮 Risk Calculator</div><div style="color:var(--muted);font-size:13px">Calculate safe position size based on your risk tolerance.</div></div>
      <div class="card">${riskHTML}</div>
      <div class="warning yellow">⚠️ Never risk more than 1-2% of your account on a single trade.</div>
    </div>`:""}

    ${state.tab==="market"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">🌡️ Market Intelligence</div><div style="color:var(--muted);font-size:13px">Fear & Greed + Sector Scanner using live data.</div></div>
      <div class="card"><div class="section-title">Fear & Greed Meter</div>${fgHTML}</div>
      <div class="card"><div class="section-title">Sector Scanner</div>${sectorsHTML}</div>
    </div>`:""}

    ${state.tab==="stockdetail"?`<div class="content">${sdHTML}</div>`:""}
  `;
}

// Init — prices every 15s, news every 30min, fear&greed every 60min
fetchLivePrices();
state.tickerInterval = setInterval(fetchLivePrices, 15000);

// Auto-refresh news every 30 minutes
setInterval(() => { if (state.news.length) fetchMarketNews(); }, 30 * 60 * 1000);

// Auto-refresh Fear & Greed every 60 minutes
setInterval(() => { if (state.fearGreed) loadFearGreed(); }, 60 * 60 * 1000);

render();
</script>
</body>
</html>
