<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TradeX AI"/>
<title>TradeX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a0e1a;--surface:#111827;--card:#161d2e;--border:#1e2d45;--accent:#00d4ff;--green:#00e676;--red:#ff4757;--yellow:#ffd600;--text:#e8f0fe;--muted:#5c7a9e;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.mono{font-family:'Space Mono',monospace;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{0%,100%{box-shadow:0 0 8px var(--green)}50%{box-shadow:0 0 20px var(--green)}}
.header{border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0057ff);display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.logo-sub{font-size:10px;color:var(--muted);}
.header-stats{display:flex;gap:14px;align-items:center;}
.stat{text-align:right;}
.stat-label{font-size:10px;color:var(--muted);}
.stat-val{font-size:13px;font-weight:700;}
.ticker-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 0;}
.ticker-inner{display:flex;gap:10px;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
.ticker-inner::-webkit-scrollbar{display:none;}
.tick{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);white-space:nowrap;flex-shrink:0;}
.tick-sym{font-size:12px;font-weight:700;color:var(--accent);}
.tick-price{font-size:12px;color:var(--text);}
.tick-chg{font-size:11px;}
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;background:var(--bg);position:sticky;top:62px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all 0.2s;color:var(--muted);white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-sub{font-size:9px;display:block;opacity:0.7;}
.content{padding:16px;max-width:600px;margin:0 auto;animation:fadeIn 0.3s ease;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.section-title{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}
.search-row{display:flex;gap:8px;margin-bottom:16px;}
.search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
.search-input::placeholder{color:var(--muted);}
.scan-btn{background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:10px 16px;color:#fff;font-weight:700;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;white-space:nowrap;}
.scan-btn:disabled{opacity:0.5;}
.signal-card{border-radius:12px;padding:16px;margin-bottom:12px;animation:fadeIn 0.4s ease;}
.signal-card.buy{background:var(--card);border:1px solid var(--green);box-shadow:0 0 20px rgba(0,230,118,0.1);}
.signal-card.sell{background:var(--card);border:1px solid var(--red);box-shadow:0 0 20px rgba(255,71,87,0.1);}
.signal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.signal-left{display:flex;align-items:center;gap:10px;}
.signal-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
.signal-badge.buy{background:rgba(0,230,118,0.15);color:var(--green);}
.signal-badge.sell{background:rgba(255,71,87,0.15);color:var(--red);}
.signal-sym{font-size:18px;font-weight:700;color:var(--accent);}
.close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;}
.signal-levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.level{background:var(--surface);border-radius:8px;padding:10px;}
.level-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.level-val{font-size:14px;font-weight:700;}
.signal-reason{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin-bottom:8px;}
.signal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tag{background:rgba(0,212,255,0.1);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px;}
.signal-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-box-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.stat-box-val{font-size:17px;font-weight:700;}
.bot-control{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:16px;transition:border 0.3s;}
.bot-status{display:flex;align-items:center;gap:10px;}
.bot-dot{width:10px;height:10px;border-radius:50%;}
.bot-dot.running{background:var(--green);animation:pulse 1s infinite,glow 2s infinite;}
.bot-dot.stopped{background:var(--muted);}
.bot-name{font-size:14px;font-weight:600;}
.bot-desc{font-size:11px;color:var(--muted);}
.bot-btn{border-radius:8px;padding:8px 18px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;transition:all 0.2s;border:1px solid;}
.bot-btn.start{background:rgba(0,230,118,0.1);border-color:var(--green);color:var(--green);}
.bot-btn.stop{background:rgba(255,71,87,0.1);border-color:var(--red);color:var(--red);}
.log-box{background:#070b14;border:1px solid var(--border);border-radius:8px;height:160px;overflow-y:auto;padding:10px;font-family:'Space Mono',monospace;font-size:11px;margin-bottom:16px;}
.log-box::-webkit-scrollbar{width:3px;}
.log-box::-webkit-scrollbar-thumb{background:var(--border);}
.log-line{margin-bottom:4px;line-height:1.5;}
.log-time{color:var(--border);}
.trade-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:12px;}
.trade-action{font-weight:700;width:38px;}
.trade-sym{color:var(--accent);font-weight:700;width:55px;}
.trade-info{color:var(--muted);flex:1;}
.trade-pnl{font-weight:700;font-size:12px;}
.empty{text-align:center;padding:50px 20px;border:1px dashed var(--border);border-radius:12px;}
.empty-icon{font-size:32px;margin-bottom:12px;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--muted);}
.warning{border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:10px;}
.warning.yellow{background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);color:var(--yellow);}
.warning.blue{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);color:var(--accent);}
.loading{text-align:center;padding:40px;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
/* RISK CALC */
.risk-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Space Mono',monospace;outline:none;margin-bottom:10px;}
.risk-result{background:var(--surface);border-radius:10px;padding:14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.risk-item{text-align:center;}
.risk-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.risk-val{font-size:16px;font-weight:700;color:var(--accent);}
/* FEAR GREED */
.fg-meter{position:relative;height:12px;border-radius:6px;background:linear-gradient(to right,#ff4757,#ffd600,#00e676);margin:16px 0;overflow:visible;}
.fg-needle{position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:white;border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,0.5);transform:translateX(-50%);transition:left 1s ease;}
.fg-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px;}
/* SECTOR */
.sector-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:8px;}
.sector-name{flex:1;font-size:13px;font-weight:600;}
.sector-bar-wrap{width:100px;height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.sector-bar{height:100%;border-radius:3px;transition:width 0.8s ease;}
.sector-chg{font-size:12px;font-weight:700;width:50px;text-align:right;}
/* SIGNAL HISTORY */
.hist-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:12px;}
.hist-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.hist-badge.buy{background:rgba(0,230,118,0.15);color:var(--green);}
.hist-badge.sell{background:rgba(255,71,87,0.15);color:var(--red);}
/* WIN/LOSS */
.wl-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.wl-box{background:var(--surface);border-radius:10px;padding:14px;text-align:center;}
.wl-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.wl-val{font-size:20px;font-weight:700;}
.wl-bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:12px 0 6px;}
.wl-bar{height:100%;background:linear-gradient(to right,var(--green),var(--accent));border-radius:4px;transition:width 0.8s ease;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "https://api.anthropic.com/v1/messages";
const TICKERS = ["AAPL","TSLA","NVDA","MSFT","AMZN","META","GOOGL","AMD","SOFI","PLTR","SPY","QQQ"];

// NOTIFICATIONS
let notifPermission = "default";
async function requestNotifications() {
  if (!("Notification" in window)) { alert("Use Safari from your home screen for notifications."); return; }
  const result = await Notification.requestPermission();
  notifPermission = result;
  if (result === "granted") { scheduleDailyReminder(); showNotif("🚀 TradeX AI", "Notifications enabled!"); }
  else alert("Go to iPhone Settings → Safari → Notifications to allow TradeX AI.");
  render();
}
function showNotif(title, body) {
  if (notifPermission !== "granted") return;
  try { new Notification(title, { body }); } catch(e) {}
}
function scheduleDailyReminder() {
  const now = new Date(), next9am = new Date();
  next9am.setHours(9,0,0,0);
  if (now >= next9am) next9am.setDate(next9am.getDate()+1);
  setTimeout(() => {
    showNotif("📈 Good morning!", "Time to scan for today's trading signals.");
    setInterval(() => showNotif("📈 Good morning!", "Time to scan for today's trading signals."), 86400000);
  }, next9am - now);
}
if ("Notification" in window) { notifPermission = Notification.permission; if (notifPermission === "granted") scheduleDailyReminder(); }

// STATE
let state = {
  tab: "signals",
  signals: [], signalHistory: [],
  loading: false, scanQuery: "",
  portfolio: { balance: 1000, pnl: 0, trades: [] },
  botRunning: false, botLog: [], botInterval: null,
  tickers: [],
  // Risk calc
  riskAccount: "", riskEntry: "", riskStop: "", riskPercent: "2",
  // Fear & Greed
  fearGreed: null, fgLoading: false,
  // Sectors
  sectors: [], sectorLoading: false,
};

function initTickers() {
  state.tickers = TICKERS.map(s => ({ symbol: s, price: (Math.random()*400+50).toFixed(2), change: (Math.random()*6-3).toFixed(2) }));
}

function addLog(msg, type="info") {
  const colors={info:"#5c7a9e",success:"#00e676",trade:"#00d4ff",warn:"#ffd600",error:"#ff4757"};
  state.botLog.push({msg,color:colors[type],time:new Date().toLocaleTimeString()});
  if (state.botLog.length>80) state.botLog=state.botLog.slice(-80);
  render();
  const box=document.getElementById("logbox"); if(box) box.scrollTop=box.scrollHeight;
}

// WIN/LOSS STATS
function getStats() {
  const closed = state.portfolio.trades.filter(t => t.exitPrice !== null);
  if (!closed.length) return null;
  const wins = closed.filter(t => (t.exitPrice - t.entryPrice) * t.shares > 0);
  const losses = closed.filter(t => (t.exitPrice - t.entryPrice) * t.shares <= 0);
  const winRate = Math.round((wins.length / closed.length) * 100);
  const avgWin = wins.length ? (wins.reduce((s,t) => s + (t.exitPrice-t.entryPrice)*t.shares, 0) / wins.length).toFixed(2) : 0;
  const avgLoss = losses.length ? (losses.reduce((s,t) => s + (t.exitPrice-t.entryPrice)*t.shares, 0) / losses.length).toFixed(2) : 0;
  const best = closed.reduce((b,t) => { const p=(t.exitPrice-t.entryPrice)*t.shares; return p>b?p:b; }, -Infinity).toFixed(2);
  const worst = closed.reduce((b,t) => { const p=(t.exitPrice-t.entryPrice)*t.shares; return p<b?p:b; }, Infinity).toFixed(2);
  return { total: closed.length, wins: wins.length, losses: losses.length, winRate, avgWin, avgLoss, best, worst };
}

// RISK CALCULATOR
function calcRisk() {
  const account = parseFloat(state.riskAccount);
  const entry = parseFloat(state.riskEntry);
  const stop = parseFloat(state.riskStop);
  const pct = parseFloat(state.riskPercent) / 100;
  if (!account || !entry || !stop || entry <= stop) return null;
  const riskPerShare = entry - stop;
  const dollarRisk = account * pct;
  const shares = Math.floor(dollarRisk / riskPerShare);
  const positionSize = (shares * entry).toFixed(2);
  const maxLoss = (shares * riskPerShare).toFixed(2);
  return { shares, positionSize, maxLoss, riskPerShare: riskPerShare.toFixed(2) };
}

// FEAR & GREED
async function loadFearGreed() {
  state.fgLoading = true; render();
  try {
    const res = await fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:200,
        system:"Return ONLY a JSON object, no markdown. Format: {\"score\":number(0-100),\"label\":string,\"summary\":string}. Score: 0-24=Extreme Fear, 25-44=Fear, 45-55=Neutral, 56-74=Greed, 75-100=Extreme Greed.",
        messages:[{role:"user",content:"What is the current stock market Fear & Greed level based on recent market conditions? Return JSON only."}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    state.fearGreed = JSON.parse(text);
  } catch(e) {
    state.fearGreed = { score: 52, label: "Neutral", summary: "Markets are showing mixed signals with cautious optimism. Volatility is moderate." };
  }
  state.fgLoading = false; render();
}

// SECTOR SCANNER
async function loadSectors() {
  state.sectorLoading = true; render();
  try {
    const res = await fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:400,
        system:"Return ONLY a JSON array of 7 stock market sectors. No markdown. Each object: {\"name\":string,\"change\":number(percentage, can be negative),\"signal\":\"BUY\"|\"SELL\"|\"NEUTRAL\",\"reason\":string(brief)}. Order by change descending.",
        messages:[{role:"user",content:"Rate the current performance and outlook for the 7 main stock sectors (Technology, Energy, Healthcare, Finance, Consumer, Materials, Utilities). JSON array only."}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    state.sectors = JSON.parse(text);
  } catch(e) {
    state.sectors = [
      {name:"Technology",change:1.8,signal:"BUY",reason:"AI momentum driving gains"},
      {name:"Energy",change:0.9,signal:"BUY",reason:"Oil prices stable, strong demand"},
      {name:"Finance",change:0.4,signal:"NEUTRAL",reason:"Rate uncertainty persists"},
      {name:"Healthcare",change:-0.2,signal:"NEUTRAL",reason:"Mixed earnings outlook"},
      {name:"Consumer",change:-0.6,signal:"NEUTRAL",reason:"Spending data mixed"},
      {name:"Materials",change:-1.1,signal:"SELL",reason:"China demand concerns"},
      {name:"Utilities",change:-1.4,signal:"SELL",reason:"Rate sensitivity hurting sector"},
    ];
  }
  state.sectorLoading = false; render();
}

// SCAN SIGNALS
async function scanSignals() {
  if (state.loading) return;
  state.loading = true; state.signals = []; render();
  try {
    const res = await fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:1000,
        system:`You are an expert stock trading analyst for day and swing trading.
Return ONLY a valid JSON array of exactly 3 trade signals. No markdown, no explanation.
Each object: symbol, action (BUY or SELL), entry (number), target (number), stopLoss (number), confidence (0-100), timeframe (string), reasoning (string), indicators (array of strings).`,
        messages:[{role:"user",content:state.scanQuery.trim()||"Find the top 3 best short-term trading opportunities right now. Focus on high-confidence setups."}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    state.signals = JSON.parse(text);
    // Save to history
    const ts = new Date().toLocaleTimeString();
    state.signalHistory = [...state.signals.map(s=>({...s,scannedAt:ts})), ...state.signalHistory].slice(0,20);
  } catch(e) {
    state.signals = [
      {symbol:"NVDA",action:"BUY",entry:924.50,target:958.00,stopLoss:910.00,confidence:82,timeframe:"1-2 days",reasoning:"Strong momentum breakout above 20-day MA with high relative volume.",indicators:["RSI 62","MACD Bullish","Vol Surge"]},
      {symbol:"TSLA",action:"BUY",entry:247.80,target:261.00,stopLoss:241.00,confidence:71,timeframe:"2-3 days",reasoning:"Bullish flag pattern. Support held at $245 twice this week.",indicators:["Bull Flag","Support Hold","OBV Rising"]},
      {symbol:"META",action:"SELL",entry:512.30,target:495.00,stopLoss:520.00,confidence:68,timeframe:"1-3 hours",reasoning:"Bearish RSI divergence at overbought levels near key resistance.",indicators:["RSI Div","Overbought","Resistance"]},
    ];
    const ts = new Date().toLocaleTimeString();
    state.signalHistory = [...state.signals.map(s=>({...s,scannedAt:ts})), ...state.signalHistory].slice(0,20);
  }
  state.loading = false; render();
}

// BOT
async function botCycle() {
  addLog("🔍 Scanning for opportunity...", "info");
  try {
    const res = await fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:300,
        system:`Automated paper trading bot. Return ONLY JSON, no markdown.
Format: {"action":"BUY","symbol":"TICKER","shares":number,"entryPrice":number,"reason":"brief"} or {"action":"HOLD","reason":"brief"}
Keep cost under $150. Balance: $${state.portfolio.balance.toFixed(2)}`,
        messages:[{role:"user",content:"One trade decision now. JSON only."}]
      })
    });
    const data = await res.json();
    const text = (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
    const d = JSON.parse(text);
    if (d.action==="HOLD") { addLog(`⏸ HOLD — ${d.reason}`,"info"); return; }
    const cost = d.shares * d.entryPrice;
    if (cost > state.portfolio.balance) { addLog(`⚠️ Insufficient funds for ${d.symbol}`,"warn"); return; }
    state.portfolio.balance -= cost;
    const trade = {...d, id:Date.now(), exitPrice:null};
    state.portfolio.trades.push(trade);
    addLog(`✅ BUY ${d.shares}x ${d.symbol} @ $${d.entryPrice} — ${d.reason}`,"trade");
    showNotif(`🤖 Bot Trade: BUY ${d.symbol}`, `${d.shares} shares @ $${d.entryPrice}`);
    render();
    setTimeout(() => {
      const exit = +(d.entryPrice*(1+(Math.random()*0.05-0.018))).toFixed(2);
      const pnl = +((exit-d.entryPrice)*d.shares).toFixed(2);
      state.portfolio.balance += d.shares * exit;
      state.portfolio.pnl += pnl;
      const idx = state.portfolio.trades.findIndex(t=>t.id===trade.id);
      if (idx!==-1) state.portfolio.trades[idx].exitPrice = exit;
      addLog(`📤 CLOSED ${d.symbol} @ $${exit} | P&L: ${pnl>=0?"+":""}$${pnl}`, pnl>=0?"success":"error");
      showNotif(`📤 Bot Closed ${d.symbol}`, `P&L: ${pnl>=0?"+":""}$${pnl}`);
      render();
    }, 8000+Math.random()*14000);
  } catch(e) { addLog("⚠️ Cycle error — will retry","warn"); }
}

function toggleBot() {
  if (state.botRunning) {
    clearInterval(state.botInterval); state.botRunning=false; addLog("🛑 Bot stopped","warn");
  } else {
    state.botRunning=true; addLog("🚀 Paper bot started! Balance: $1,000","success");
    botCycle(); state.botInterval=setInterval(botCycle,32000);
  }
  render();
}

function removeSignal(i) { state.signals.splice(i,1); render(); }
function switchTab(t) { state.tab=t; render(); if(t==="market" && !state.fearGreed && !state.fgLoading) { loadFearGreed(); loadSectors(); } }

// RENDER
function render() {
  const pnlColor = state.portfolio.pnl>=0?"var(--green)":"var(--red)";
  const stats = getStats();
  const riskResult = calcRisk();

  const tickersHTML = state.tickers.map(t => {
    const up = parseFloat(t.change)>=0;
    return `<div class="tick"><span class="tick-sym mono">${t.symbol}</span><span class="tick-price mono">$${t.price}</span><span class="tick-chg" style="color:${up?"var(--green)":"var(--red)"}">${up?"▲":"▼"}${Math.abs(t.change)}%</span></div>`;
  }).join("");

  // Signals HTML
  let signalsHTML = "";
  if (state.loading) {
    signalsHTML = `<div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px">AI analyzing market conditions...</div></div>`;
  } else if (!state.signals.length) {
    signalsHTML = `<div class="empty"><div class="empty-icon">📡</div><div class="empty-title">Ready to scan</div><div class="empty-sub">Hit Scan to get AI-powered buy/sell signals</div></div>`;
  } else {
    signalsHTML = state.signals.map((s,i) => {
      const isBuy=s.action==="BUY", cls=isBuy?"buy":"sell";
      return `<div class="signal-card ${cls}">
        <div class="signal-header"><div class="signal-left"><span class="signal-badge ${cls}">${s.action}</span><span class="signal-sym mono">${s.symbol}</span></div><button class="close-btn" onclick="removeSignal(${i})">×</button></div>
        <div class="signal-levels">
          <div class="level"><div class="level-label">Entry</div><div class="level-val mono">$${s.entry}</div></div>
          <div class="level"><div class="level-label">Target</div><div class="level-val mono" style="color:var(--green)">$${s.target}</div></div>
          <div class="level"><div class="level-label">Stop Loss</div><div class="level-val mono" style="color:var(--red)">$${s.stopLoss}</div></div>
        </div>
        <div class="signal-reason"><span style="color:var(--yellow);font-weight:600">AI: </span>${s.reasoning}</div>
        <div class="signal-tags">${(s.indicators||[]).map(ind=>`<span class="tag">${ind}</span>`).join("")}</div>
        <div class="signal-meta"><span>Confidence: <span class="mono" style="color:${s.confidence>75?"var(--green)":s.confidence>50?"var(--yellow)":"var(--red)"};font-weight:700">${s.confidence}%</span></span><span>Timeframe: ${s.timeframe}</span></div>
      </div>`;
    }).join("") + `<div class="warning yellow">⚠️ AI signals for educational purposes only. Always do your own research.</div>`;
  }

  // Signal History HTML
  const histHTML = !state.signalHistory.length
    ? `<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">No signal history yet. Run a scan first!</div>`
    : state.signalHistory.map(s => `<div class="hist-row">
        <span class="hist-badge ${s.action.toLowerCase()}">${s.action}</span>
        <span style="color:var(--accent);font-weight:700;width:55px">${s.symbol}</span>
        <span style="color:var(--muted);flex:1">$${s.entry} → $${s.target}</span>
        <span style="color:var(--muted);font-size:11px">${s.scannedAt}</span>
      </div>`).join("");

  // Win/Loss Stats HTML
  const wlHTML = !stats
    ? `<div style="color:var(--muted);font-size:13px;text-align:center;padding:20px">Start the bot to generate trade statistics!</div>`
    : `<div class="wl-grid">
        <div class="wl-box"><div class="wl-label">Win Rate</div><div class="wl-val" style="color:${stats.winRate>=50?"var(--green)":"var(--red)"}">${stats.winRate}%</div></div>
        <div class="wl-box"><div class="wl-label">Total Trades</div><div class="wl-val" style="color:var(--accent)">${stats.total}</div></div>
        <div class="wl-box"><div class="wl-label">Wins</div><div class="wl-val" style="color:var(--green)">${stats.wins}</div></div>
        <div class="wl-box"><div class="wl-label">Losses</div><div class="wl-val" style="color:var(--red)">${stats.losses}</div></div>
      </div>
      <div class="wl-bar-wrap"><div class="wl-bar" style="width:${stats.winRate}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:14px"><span>0%</span><span>Win Rate ${stats.winRate}%</span><span>100%</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div class="wl-box"><div class="wl-label">Avg Win</div><div class="wl-val" style="color:var(--green);font-size:16px">+$${stats.avgWin}</div></div>
        <div class="wl-box"><div class="wl-label">Avg Loss</div><div class="wl-val" style="color:var(--red);font-size:16px">$${stats.avgLoss}</div></div>
        <div class="wl-box"><div class="wl-label">Best Trade</div><div class="wl-val" style="color:var(--green);font-size:16px">+$${stats.best}</div></div>
        <div class="wl-box"><div class="wl-label">Worst Trade</div><div class="wl-val" style="color:var(--red);font-size:16px">$${stats.worst}</div></div>
      </div>`;

  // Risk Calc HTML
  const riskHTML = `
    <div style="margin-bottom:8px;font-size:12px;color:var(--muted)">Enter your trade details to calculate the safe position size.</div>
    <input class="risk-input" placeholder="Account size (e.g. 5000)" value="${state.riskAccount}" oninput="state.riskAccount=this.value;render()" type="number"/>
    <input class="risk-input" placeholder="Entry price (e.g. 150.00)" value="${state.riskEntry}" oninput="state.riskEntry=this.value;render()" type="number"/>
    <input class="risk-input" placeholder="Stop loss price (e.g. 145.00)" value="${state.riskStop}" oninput="state.riskStop=this.value;render()" type="number"/>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <span style="font-size:12px;color:var(--muted);white-space:nowrap">Risk %:</span>
      ${["1","2","3","5"].map(p=>`<button onclick="state.riskPercent='${p}';render()" style="background:${state.riskPercent===p?"var(--accent)":"var(--surface)"};color:${state.riskPercent===p?"#000":"var(--text)"};border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:12px">${p}%</button>`).join("")}
    </div>
    ${riskResult ? `<div class="risk-result">
      <div class="risk-item"><div class="risk-label">Shares to Buy</div><div class="risk-val">${riskResult.shares}</div></div>
      <div class="risk-item"><div class="risk-label">Position Size</div><div class="risk-val">$${riskResult.positionSize}</div></div>
      <div class="risk-item"><div class="risk-label">Max Loss</div><div class="risk-val" style="color:var(--red)">$${riskResult.maxLoss}</div></div>
      <div class="risk-item"><div class="risk-label">Risk/Share</div><div class="risk-val" style="color:var(--yellow)">$${riskResult.riskPerShare}</div></div>
    </div>` : `<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px">Fill in all fields to see your position size</div>`}`;

  // Fear & Greed HTML
  const fgScore = state.fearGreed ? state.fearGreed.score : 50;
  const fgColor = fgScore < 25 ? "var(--red)" : fgScore < 45 ? "#ff8c00" : fgScore < 55 ? "var(--yellow)" : fgScore < 75 ? "#90ee90" : "var(--green)";
  const fgHTML = state.fgLoading
    ? `<div class="loading"><div class="spinner"></div></div>`
    : `<div style="text-align:center;margin-bottom:8px">
        <div style="font-size:36px;font-weight:700;color:${fgColor}">${fgScore}</div>
        <div style="font-size:16px;font-weight:700;color:${fgColor};margin-bottom:4px">${state.fearGreed ? state.fearGreed.label : "Loading..."}</div>
      </div>
      <div class="fg-meter"><div class="fg-needle" style="left:${fgScore}%"></div></div>
      <div class="fg-labels"><span>Extreme Fear</span><span>Neutral</span><span>Extreme Greed</span></div>
      ${state.fearGreed ? `<div style="margin-top:12px;font-size:13px;color:var(--muted);line-height:1.6">${state.fearGreed.summary}</div>` : ""}
      <button onclick="loadFearGreed()" style="margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 16px;color:var(--text);font-size:12px;cursor:pointer;width:100%">🔄 Refresh</button>`;

  // Sectors HTML
  const sectorsHTML = state.sectorLoading
    ? `<div class="loading"><div class="spinner"></div></div>`
    : !state.sectors.length
    ? `<button onclick="loadSectors()" style="background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:12px;color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:13px">🔍 Scan Sectors</button>`
    : state.sectors.map(s => {
        const up = s.change >= 0;
        const barColor = s.signal==="BUY"?"var(--green)":s.signal==="SELL"?"var(--red)":"var(--yellow)";
        const barWidth = Math.min(Math.abs(s.change) * 20, 100);
        return `<div class="sector-row">
          <div>
            <div class="sector-name">${s.name}</div>
            <div style="font-size:11px;color:var(--muted)">${s.reason}</div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="sector-bar-wrap"><div class="sector-bar" style="width:${barWidth}%;background:${barColor}"></div></div>
            <div class="sector-chg" style="color:${up?"var(--green)":"var(--red)"}">${up?"+":""}${s.change}%</div>
            <span style="font-size:10px;padding:2px 6px;border-radius:4px;background:${s.signal==="BUY"?"rgba(0,230,118,0.15)":s.signal==="SELL"?"rgba(255,71,87,0.15)":"rgba(255,214,0,0.15)"};color:${s.signal==="BUY"?"var(--green)":s.signal==="SELL"?"var(--red)":"var(--yellow)"};font-weight:700">${s.signal}</span>
          </div>
        </div>`;
      }).join("") + `<button onclick="loadSectors()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:12px;cursor:pointer;width:100%;margin-top:4px">🔄 Refresh Sectors</button>`;

  // Bot trades
  const tradesHTML = !state.portfolio.trades.length ? "" :
    `<div class="section-title">Trade History</div>` +
    state.portfolio.trades.slice(-8).reverse().map(t => {
      const pnl = t.exitPrice ? ((t.exitPrice-t.entryPrice)*t.shares).toFixed(2) : null;
      return `<div class="trade-row">
        <span class="trade-action mono" style="color:${t.action==="BUY"?"var(--green)":"var(--red)"}">${t.action}</span>
        <span class="trade-sym mono">${t.symbol}</span>
        <span class="trade-info">${t.shares}x @ $${t.entryPrice}</span>
        ${pnl!==null?`<span class="trade-pnl mono" style="color:${pnl>=0?"var(--green)":"var(--red)"}">${pnl>=0?"+":""}$${pnl}</span>`:`<span style="color:var(--yellow);font-size:11px">OPEN</span>`}
      </div>`;
    }).join("");

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div><div class="logo-text mono">TRADEX AI</div><div class="logo-sub">Signals + Auto-Bot</div></div>
      </div>
      <div class="header-stats">
        <div class="stat"><div class="stat-label">Balance</div><div class="stat-val mono">$${state.portfolio.balance.toFixed(2)}</div></div>
        <div class="stat"><div class="stat-label">P&L</div><div class="stat-val mono" style="color:${pnlColor}">${state.portfolio.pnl>=0?"+":""}$${state.portfolio.pnl.toFixed(2)}</div></div>
      </div>
    </div>
    <div class="ticker-wrap"><div class="ticker-inner">${tickersHTML}</div></div>
    <div class="tabs">
      <button class="tab ${state.tab==="signals"?"active":""}" onclick="switchTab('signals')">📡 Signals<span class="tab-sub">Wealthsimple</span></button>
      <button class="tab ${state.tab==="bot"?"active":""}" onclick="switchTab('bot')">🤖 Bot<span class="tab-sub">Paper</span></button>
      <button class="tab ${state.tab==="stats"?"active":""}" onclick="switchTab('stats')">📊 Stats<span class="tab-sub">Win/Loss</span></button>
      <button class="tab ${state.tab==="risk"?"active":""}" onclick="switchTab('risk')">🧮 Risk<span class="tab-sub">Calculator</span></button>
      <button class="tab ${state.tab==="market"?"active":""}" onclick="switchTab('market')">🌡️ Market<span class="tab-sub">Fear/Greed</span></button>
    </div>

    ${state.tab==="signals"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">AI Trading Signals</div><div style="color:var(--muted);font-size:13px">Claude scans the market and gives you precise entry/exit levels.</div></div>
      <div class="search-row"><input class="search-input" placeholder="e.g. 'Tech momentum plays' or leave blank..." value="${state.scanQuery}" oninput="state.scanQuery=this.value" onkeydown="if(event.key==='Enter')scanSignals()"/><button class="scan-btn" onclick="scanSignals()" ${state.loading?"disabled":""}>⚡ Scan</button></div>
      ${signalsHTML}
      ${state.signalHistory.length?`<div style="margin-top:20px"><div class="section-title">Signal History</div>${histHTML}</div>`:""}
    </div>`:""}

    ${state.tab==="bot"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">Paper Trading Bot</div><div style="color:var(--muted);font-size:13px">Fully automated AI trading. $1,000 paper money — zero real risk.</div></div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-box-label">Balance</div><div class="stat-box-val mono">$${state.portfolio.balance.toFixed(0)}</div></div>
        <div class="stat-box"><div class="stat-box-label">P&L</div><div class="stat-box-val mono" style="color:${pnlColor}">${state.portfolio.pnl>=0?"+":""}$${state.portfolio.pnl.toFixed(2)}</div></div>
        <div class="stat-box"><div class="stat-box-label">Trades</div><div class="stat-box-val mono" style="color:var(--accent)">${state.portfolio.trades.length}</div></div>
      </div>
      <div class="bot-control" style="border:1px solid ${state.botRunning?"var(--green)":"var(--border)"}">
        <div class="bot-status"><div class="bot-dot ${state.botRunning?"running":"stopped"}"></div><div><div class="bot-name">${state.botRunning?"Bot Running":"Bot Stopped"}</div><div class="bot-desc">${state.botRunning?"Trading every ~30 seconds":"Tap Start to begin"}</div></div></div>
        <button class="bot-btn ${state.botRunning?"stop":"start"}" onclick="toggleBot()">${state.botRunning?"⏹ Stop":"▶ Start"}</button>
      </div>
      <div class="section-title">Live Bot Log</div>
      <div class="log-box" id="logbox">${state.botLog.length?state.botLog.map(l=>`<div class="log-line"><span class="log-time">[${l.time}] </span><span style="color:${l.color}">${l.msg}</span></div>`).join(""):`<span style="color:var(--muted)">Waiting for bot to start...</span>`}</div>
      ${tradesHTML}
      <div style="margin-top:12px">
        ${notifPermission==="granted"?`<div class="warning blue">🔔 Notifications active — you'll get trade alerts!</div>`:`<div style="background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px"><div style="font-size:12px;color:var(--yellow);line-height:1.5">🔔 Enable bot trade alerts &amp; daily reminders</div><button onclick="requestNotifications()" style="background:var(--yellow);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap">Enable</button></div>`}
      </div>
      <div class="warning blue" style="margin-top:8px">ℹ️ Paper trading only — no real money used.</div>
    </div>`:""}

    ${state.tab==="stats"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">📊 Win/Loss Stats</div><div style="color:var(--muted);font-size:13px">Your bot's performance breakdown.</div></div>
      ${wlHTML}
      <div style="margin-top:20px"><div class="section-title">Signal History</div>${histHTML}</div>
    </div>`:""}

    ${state.tab==="risk"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">🧮 Risk Calculator</div><div style="color:var(--muted);font-size:13px">Calculate the safe number of shares to buy based on your risk tolerance.</div></div>
      <div class="card">${riskHTML}</div>
      <div class="warning yellow">⚠️ Never risk more than 1-2% of your account on a single trade. This is the golden rule of trading.</div>
    </div>`:""}

    ${state.tab==="market"?`<div class="content">
      <div style="margin-bottom:16px"><div style="font-size:19px;font-weight:700;margin-bottom:4px">🌡️ Market Intelligence</div><div style="color:var(--muted);font-size:13px">Fear & Greed meter plus sector performance.</div></div>
      <div class="card"><div class="section-title">Fear & Greed Meter</div>${fgHTML}</div>
      <div class="card"><div class="section-title">Sector Scanner</div>${sectorsHTML}</div>
    </div>`:""}
  `;
}

initTickers();
render();
</script>
</body>
</html>
