<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TradeX AI"/>
<title>TradeX AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0a0e1a;--surface:#111827;--card:#161d2e;--border:#1e2d45;
  --accent:#00d4ff;--green:#00e676;--red:#ff4757;--yellow:#ffd600;
  --text:#e8f0fe;--muted:#5c7a9e;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.mono{font-family:'Space Mono',monospace;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
/* HEADER */
.header{border-bottom:1px solid var(--border);padding:14px 16px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0057ff);display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
.logo-sub{font-size:10px;color:var(--muted);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite;display:inline-block;margin-right:4px;}
.header-right{display:flex;gap:12px;align-items:center;}
.hstat{text-align:right;}
.hstat-label{font-size:10px;color:var(--muted);}
.hstat-val{font-size:13px;font-weight:700;}
/* TICKER BAR */
.ticker-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 0;}
.ticker-inner{display:flex;gap:10px;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
.ticker-inner::-webkit-scrollbar{display:none;}
.tick{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);white-space:nowrap;flex-shrink:0;}
.tick-sym{font-size:12px;font-weight:700;color:var(--accent);}
.tick-price{font-size:12px;}
.tick-chg{font-size:11px;}
/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);padding:0 8px;background:var(--bg);position:sticky;top:63px;z-index:99;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{background:none;border:none;padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;flex-shrink:0;transition:all .2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-sub{font-size:9px;display:block;opacity:.7;}
/* CONTENT */
.content{padding:16px;max-width:600px;margin:0 auto;animation:fadeIn .3s ease;}
.page-title{font-size:19px;font-weight:700;margin-bottom:4px;}
.page-sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
/* CARDS */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.section-title{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
/* STATS GRID */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stats-grid.two{grid-template-columns:1fr 1fr;}
.stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
.stat-box-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
.stat-box-val{font-size:17px;font-weight:700;}
/* SIGNALS */
.search-row{display:flex;gap:8px;margin-bottom:16px;}
.search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
.search-input::placeholder{color:var(--muted);}
.scan-btn{background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:10px 16px;color:#fff;font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap;}
.scan-btn:disabled{opacity:.5;}
.signal-card{border-radius:12px;padding:16px;margin-bottom:12px;animation:fadeIn .4s ease;}
.signal-card.buy{background:var(--card);border:1px solid var(--green);box-shadow:0 0 20px rgba(0,230,118,.08);}
.signal-card.sell{background:var(--card);border:1px solid var(--red);box-shadow:0 0 20px rgba(255,71,87,.08);}
.signal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.signal-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
.signal-badge.buy{background:rgba(0,230,118,.15);color:var(--green);}
.signal-badge.sell{background:rgba(255,71,87,.15);color:var(--red);}
.signal-sym{font-size:18px;font-weight:700;color:var(--accent);}
.live-badge{background:rgba(0,230,118,.15);color:var(--green);padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;}
.close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}
.signal-levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
.level{background:var(--surface);border-radius:8px;padding:10px;}
.level-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.level-val{font-size:14px;font-weight:700;}
.signal-reason{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin-bottom:8px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tag{background:rgba(0,212,255,.1);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px;}
.signal-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
/* BOT */
.bot-control{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:14px;transition:border .3s;}
.bot-dot{width:10px;height:10px;border-radius:50%;}
.bot-dot.on{background:var(--green);animation:pulse 1s infinite;}
.bot-dot.off{background:var(--muted);}
.bot-name{font-size:14px;font-weight:600;}
.bot-desc{font-size:11px;color:var(--muted);}
.bot-btn{border-radius:8px;padding:8px 18px;cursor:pointer;font-weight:700;font-size:12px;border:1px solid;}
.bot-btn.start{background:rgba(0,230,118,.1);border-color:var(--green);color:var(--green);}
.bot-btn.stop{background:rgba(255,71,87,.1);border-color:var(--red);color:var(--red);}
/* LOG */
.log-box{background:#070b14;border:1px solid var(--border);border-radius:8px;height:180px;overflow-y:auto;padding:10px;font-family:'Space Mono',monospace;font-size:11px;margin-bottom:14px;}
.log-box::-webkit-scrollbar{width:3px;}
.log-box::-webkit-scrollbar-thumb{background:var(--border);}
.log-line{margin-bottom:4px;line-height:1.5;}
.log-time{color:var(--border);}
/* TRADES */
.trade-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:12px;}
.trade-action{font-weight:700;width:38px;}
.trade-sym{color:var(--accent);font-weight:700;width:55px;}
.trade-info{color:var(--muted);flex:1;}
.trade-pnl{font-weight:700;}
/* POSITION CARD */
.pos-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;}
.pos-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.pos-sym{font-size:16px;font-weight:700;color:var(--accent);}
.pos-qty{font-size:12px;color:var(--muted);}
.pos-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.pos-item{text-align:center;}
.pos-label{font-size:10px;color:var(--muted);margin-bottom:2px;}
.pos-val{font-size:13px;font-weight:700;}
/* MISC */
.empty{text-align:center;padding:40px 20px;border:1px dashed var(--border);border-radius:12px;}
.empty-icon{font-size:32px;margin-bottom:10px;}
.empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
.empty-sub{font-size:13px;color:var(--muted);}
.warning{border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-bottom:10px;}
.warning.yellow{background:rgba(255,214,0,.08);border:1px solid rgba(255,214,0,.2);color:var(--yellow);}
.warning.blue{background:rgba(0,212,255,.06);border:1px solid rgba(0,212,255,.15);color:var(--accent);}
.warning.green{background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.2);color:var(--green);}
.warning.red{background:rgba(255,71,87,.06);border:1px solid rgba(255,71,87,.2);color:var(--red);}
.loading{text-align:center;padding:40px;}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
.mode-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
.mode-badge.paper{background:rgba(255,214,0,.15);color:var(--yellow);}
.mode-badge.live{background:rgba(0,230,118,.15);color:var(--green);}
/* RISK CALC */
.risk-input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:'Space Mono',monospace;outline:none;margin-bottom:10px;}
.risk-result{background:var(--surface);border-radius:10px;padding:14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.risk-item{text-align:center;}
.risk-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
.risk-val{font-size:16px;font-weight:700;color:var(--accent);}
/* MARKET METER */
.fg-meter{position:relative;height:12px;border-radius:6px;background:linear-gradient(to right,#ff4757,#ffd600,#00e676);margin:16px 0;}
.fg-needle{position:absolute;top:-4px;width:20px;height:20px;border-radius:50%;background:white;border:3px solid var(--bg);box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translateX(-50%);transition:left 1s ease;}
.fg-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:6px;}
.win-bar-wrap{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin:12px 0 6px;}
.win-bar{height:100%;background:linear-gradient(to right,var(--green),var(--accent));border-radius:4px;transition:width .8s ease;}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ── CONFIG ─────────────────────────────────────────────────
const API_URL = "https://worker-production-0c6e.up.railway.app";
const POLYGON_KEY = "0ALkLfbzvxUnKNycJTqal0uGK0dj4gJf";
const POLYGON = "https://api.polygon.io";
const TICKERS = ["AAPL","TSLA","NVDA","MSFT","AMZN","META","AMD","SOFI","PLTR","SPY","QQQ"];

// ── CLAUDE API ─────────────────────────────────────────────
async function claude(system, userMsg, max_tokens=800) {
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens,
        system,
        messages:[{role:"user",content:userMsg}]
      })
    });
    const data = await res.json();
    return (data.content||[]).map(c=>c.text||"").join("").replace(/```json|```/g,"").trim();
  } catch(e) { return null; }
}

// ── STATE ──────────────────────────────────────────────────
const S = {
  tab: "dashboard",
  tickers: [],
  lastUpdate: null,
  // dashboard (live from Railway)
  liveStats: null, liveLoading: false, liveError: null,
  livePositions: [], liveBalance: null, liveOrders: [],
  botRunning: false, botMode: "paper", marketOpen: false, marketReason: "",
  // signals (AI)
  signals: [], signalHistory: [], scanning: false, scanQuery: "",
  // fear & greed
  fearGreed: null, fgLoading: false,
  // risk calc
  riskAccount:"", riskEntry:"", riskStop:"", riskPct:"2",
};

// ── PRICES ─────────────────────────────────────────────────
async function fetchPrices() {
  try {
    const url = `${POLYGON}/v2/snapshot/locale/us/markets/stocks/tickers?tickers=${TICKERS.join(",")}&apiKey=${POLYGON_KEY}`;
    const res = await fetch(url);
    const data = await res.json();
    if (data.tickers?.length) {
      S.tickers = data.tickers.map(t => ({
        symbol: t.ticker,
        price: (t.day?.c || t.prevDay?.c || 0).toFixed(2),
        change: (t.todaysChangePerc || 0).toFixed(2),
      }));
      S.lastUpdate = new Date().toLocaleTimeString();
    }
    render();
  } catch(e) {
    if (!S.tickers.length)
      S.tickers = TICKERS.map(s=>({symbol:s,price:(Math.random()*300+50).toFixed(2),change:(Math.random()*4-2).toFixed(2)}));
    render();
  }
}

// ── RAILWAY API ────────────────────────────────────────────
async function fetchDashboard() {
  S.liveLoading = true; S.liveError = null; render();
  try {
    const [statsRes, posRes, balRes, botRes] = await Promise.all([
      fetch(API_URL + "/api/stats"),
      fetch(API_URL + "/api/positions"),
      fetch(API_URL + "/api/balance"),
      fetch(API_URL + "/api/bot/status"),
    ]);
    S.liveStats     = await statsRes.json();
    const posData   = await posRes.json();
    S.liveBalance   = await balRes.json();
    const botData   = await botRes.json();
    S.livePositions = posData.positions || [];
    S.botRunning    = botData.running;
    S.botMode       = botData.mode || "paper";
    S.marketOpen    = botData.market_open;
    S.marketReason  = botData.market_reason;
  } catch(e) {
    S.liveError = "Cannot reach Railway API — check deployment";
  }
  S.liveLoading = false; render();
}

async function toggleBot() {
  const endpoint = S.botRunning ? "/api/bot/stop" : "/api/bot/start";
  try {
    await fetch(API_URL + endpoint, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    S.botRunning = !S.botRunning;
    render();
    setTimeout(fetchDashboard, 1500);
  } catch(e) {}
}

// ── AI SIGNALS ─────────────────────────────────────────────
async function scanSignals() {
  if (S.scanning) return;
  S.scanning = true; S.signals = []; render();
  const prices = S.tickers.slice(0,8).map(t=>`${t.symbol}:$${t.price}(${t.change}%)`).join(",");
  const text = await claude(
    `You are an expert trading analyst. Return ONLY a valid JSON array of exactly 3 trade signals. No markdown, no explanation.
Each: {symbol,action("BUY"|"SELL"),entry(number),target(number),stopLoss(number),confidence(0-100),timeframe(string),reasoning(string),indicators(string[]],rsi(number),macd("Bullish"|"Bearish"|"Neutral")}`,
    `Live prices: ${prices}\nQuery: ${S.scanQuery.trim() || "Find 3 best short-term momentum opportunities"}`
  );
  try {
    S.signals = JSON.parse(text);
    const ts = new Date().toLocaleTimeString();
    S.signalHistory = [...S.signals.map(s=>({...s,ts})), ...S.signalHistory].slice(0,20);
  } catch(e) {
    const p = s => parseFloat(S.tickers.find(t=>t.symbol===s)?.price || "100");
    const nvda=p("NVDA"), tsla=p("TSLA"), aapl=p("AAPL");
    S.signals = [
      {symbol:"NVDA",action:"BUY",entry:nvda,target:+(nvda*1.035).toFixed(2),stopLoss:+(nvda*.985).toFixed(2),confidence:82,timeframe:"1-2 days",reasoning:`Live $${nvda}. AI demand narrative + momentum.`,indicators:["RSI 62","MACD Bull","High Vol"],rsi:62,macd:"Bullish"},
      {symbol:"TSLA",action:"BUY",entry:tsla,target:+(tsla*1.05).toFixed(2),stopLoss:+(tsla*.975).toFixed(2),confidence:70,timeframe:"2-3 days",reasoning:`Live $${tsla}. Bull flag pattern holding.`,indicators:["Bull Flag","Support"],rsi:48,macd:"Bullish"},
      {symbol:"AAPL",action:"SELL",entry:aapl,target:+(aapl*.97).toFixed(2),stopLoss:+(aapl*1.015).toFixed(2),confidence:65,timeframe:"1 day",reasoning:`Live $${aapl}. RSI divergence at resistance.`,indicators:["RSI Div","Resistance"],rsi:74,macd:"Bearish"},
    ];
  }
  S.scanning = false; render();
}

// ── FEAR & GREED ───────────────────────────────────────────
async function loadFG() {
  S.fgLoading = true; render();
  const prices = S.tickers.slice(0,6).map(t=>`${t.symbol}:${t.change}%`).join(",");
  const text = await claude(
    'Return ONLY JSON: {"score":number(0-100),"label":string,"summary":string(1 sentence)}',
    `Based on these market moves: ${prices} — what is the Fear & Greed level?`
  );
  try { S.fearGreed = JSON.parse(text); }
  catch { S.fearGreed = {score:50,label:"Neutral",summary:"Mixed market signals."}; }
  S.fgLoading = false; render();
}

// ── RISK CALC ──────────────────────────────────────────────
function calcRisk() {
  const a=parseFloat(S.riskAccount), e=parseFloat(S.riskEntry), s=parseFloat(S.riskStop), p=parseFloat(S.riskPct)/100;
  if (!a||!e||!s||e<=s) return null;
  const rps=e-s, dr=a*p, shares=Math.floor(dr/rps);
  return {shares, size:(shares*e).toFixed(2), maxLoss:(shares*rps).toFixed(2), rps:rps.toFixed(2)};
}

// ── HELPERS ────────────────────────────────────────────────
function switchTab(t) {
  S.tab = t;
  if (t==="dashboard") fetchDashboard();
  if (t==="market" && !S.fearGreed) loadFG();
  render();
}
const pnlColor = v => parseFloat(v)>=0 ? "var(--green)" : "var(--red)";
const pnlSign  = v => parseFloat(v)>=0 ? "+" : "";

// ── RENDER ─────────────────────────────────────────────────
function render() {
  const stats = S.liveStats?.stats || {};
  const snap  = S.liveStats?.snapshot;
  const trades = S.liveStats?.trades || [];
  const logs   = S.liveStats?.logs || [];
  const rr = calcRisk();

  // TICKER BAR
  const tickerHTML = S.tickers.map(t => {
    const up = parseFloat(t.change)>=0;
    return `<div class="tick">
      <span class="tick-sym mono">${t.symbol}</span>
      <span class="tick-price mono">$${t.price}</span>
      <span class="tick-chg" style="color:${up?"var(--green)":"var(--red)"}">${up?"▲":"▼"}${Math.abs(t.change)}%</span>
    </div>`;
  }).join("");

  // TABS
  const tabs = [
    {id:"dashboard",icon:"💰",label:"Dashboard",sub:"Live"},
    {id:"signals",icon:"📡",label:"Signals",sub:"AI"},
    {id:"bot",icon:"🤖",label:"Bot",sub:"Control"},
    {id:"market",icon:"🌡️",label:"Market",sub:"Sentiment"},
    {id:"risk",icon:"🧮",label:"Risk",sub:"Calc"},
  ];
  const tabsHTML = tabs.map(t=>`<button class="tab ${S.tab===t.id?"active":""}" onclick="switchTab('${t.id}')">${t.icon} ${t.label}<span class="tab-sub">${t.sub}</span></button>`).join("");

  // DASHBOARD TAB
  let dashHTML = "";
  if (S.tab==="dashboard") {
    if (S.liveLoading) {
      dashHTML = `<div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px">Connecting to Railway bot...</div></div>`;
    } else if (S.liveError) {
      dashHTML = `<div class="warning red">❌ ${S.liveError}</div>
        <button onclick="fetchDashboard()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:13px;cursor:pointer;width:100%">🔄 Retry</button>`;
    } else {
      const bal = S.liveBalance || {};
      const totalEquity = snap?.total_equity ?? bal.total_equity ?? 0;
      const cash = snap?.cash ?? bal.cash ?? 0;
      const mktVal = snap?.market_value ?? bal.market_value ?? 0;
      const modeBadge = `<span class="mode-badge ${S.botMode}">${S.botMode.toUpperCase()}</span>`;
      dashHTML = `
        <!-- Market Status Banner -->
        <div style="background:${S.marketOpen?"rgba(0,230,118,.08)":"rgba(255,71,87,.08)"};border:1px solid ${S.marketOpen?"rgba(0,230,118,.3)":"rgba(255,71,87,.3)"};border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;font-size:12px">
          <span style="font-size:16px">${S.marketOpen?"🟢":"🔴"}</span>
          <span style="font-weight:600;color:${S.marketOpen?"var(--green)":"var(--red)"}">${S.marketOpen?"Market Open":"Market Closed"}</span>
          <span style="color:var(--muted)">${S.marketReason}</span>
        </div>

        <!-- Balance Cards -->
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-box-label">Total Equity</div><div class="stat-box-val mono" style="color:var(--green)">$${totalEquity.toFixed(2)}</div></div>
          <div class="stat-box"><div class="stat-box-label">Cash</div><div class="stat-box-val mono">$${cash.toFixed(2)}</div></div>
          <div class="stat-box"><div class="stat-box-label">Market Val</div><div class="stat-box-val mono" style="color:var(--accent)">$${mktVal.toFixed(2)}</div></div>
        </div>

        <!-- P&L Stats -->
        <div class="stats-grid">
          <div class="stat-box"><div class="stat-box-label">Total P&L</div><div class="stat-box-val mono" style="color:${pnlColor(stats.total_pnl)}">${pnlSign(stats.total_pnl)}$${(stats.total_pnl||0).toFixed(2)}</div></div>
          <div class="stat-box"><div class="stat-box-label">Win Rate</div><div class="stat-box-val mono" style="color:${(stats.win_rate||0)>=50?"var(--green)":"var(--red)"}">${stats.win_rate||0}%</div></div>
          <div class="stat-box"><div class="stat-box-label">Trades</div><div class="stat-box-val mono" style="color:var(--accent)">${stats.total||0}</div></div>
        </div>

        <!-- Open Positions -->
        ${S.livePositions.length?`
          <div class="section-title" style="margin-top:4px">Open Positions</div>
          ${S.livePositions.map(p=>`
            <div class="pos-card">
              <div class="pos-header">
                <span class="pos-sym">${p.symbol}</span>
                <span class="pos-qty">${p.openQuantity} shares</span>
              </div>
              <div class="pos-grid">
                <div class="pos-item"><div class="pos-label">Current</div><div class="pos-val">$${(p.currentPrice||0).toFixed(2)}</div></div>
                <div class="pos-item"><div class="pos-label">Open P&L</div><div class="pos-val" style="color:${pnlColor(p.openPnl)}">${pnlSign(p.openPnl)}$${(p.openPnl||0).toFixed(2)}</div></div>
                <div class="pos-item"><div class="pos-label">Cost</div><div class="pos-val">$${(p.totalCost||0).toFixed(2)}</div></div>
              </div>
            </div>
          `).join("")}
        `:""}

        <!-- Recent Trades from DB -->
        ${trades.length?`
          <div class="section-title">Recent Trades</div>
          ${trades.slice(0,8).map(t=>`<div class="trade-row">
            <span class="trade-action mono" style="color:${t.action==="BUY"?"var(--green)":"var(--red)"}">${t.action}</span>
            <span class="trade-sym mono">${t.symbol}</span>
            <span class="trade-info">${t.shares}x @ $${(t.entry_price||0).toFixed(2)}</span>
            ${t.status==="CLOSED"
              ?`<span class="trade-pnl mono" style="color:${pnlColor(t.pnl)}">${pnlSign(t.pnl)}$${(t.pnl||0).toFixed(2)}</span>`
              :`<span style="color:var(--yellow);font-size:11px">${t.mode?.toUpperCase()||"OPEN"}</span>`
            }
          </div>`).join("")}
        `:""}

        <!-- Live Log from Railway -->
        ${logs.length?`
          <div class="section-title" style="margin-top:4px">Live Bot Log</div>
          <div class="log-box" id="logbox">
            ${logs.map(l=>`<div class="log-line">
              <span class="log-time">[${new Date(l.created_at).toLocaleTimeString()}] </span>
              <span style="color:${
                l.log_type==="success"?"var(--green)":
                l.log_type==="error"?"var(--red)":
                l.log_type==="trade"?"var(--accent)":
                l.log_type==="warn"?"var(--yellow)":"var(--muted)"
              }">${l.message}</span>
            </div>`).join("")}
          </div>
        `:""}

        <button onclick="fetchDashboard()" style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:12px;cursor:pointer;width:100%;margin-top:4px">🔄 Refresh</button>
        <div class="warning blue" style="margin-top:10px">Mode: ${modeBadge} — To switch to LIVE trading, set <span class="mono">BOT_MODE=live</span> in Railway variables.</div>
      `;
    }
  }

  // SIGNALS TAB
  let sigHTML = "";
  if (S.tab==="signals") {
    let cardsHTML = "";
    if (S.scanning) {
      cardsHTML = `<div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px">AI analyzing live market data...</div></div>`;
    } else if (!S.signals.length) {
      cardsHTML = `<div class="empty"><div class="empty-icon">📡</div><div class="empty-title">Ready to scan</div><div class="empty-sub">AI signals powered by live Polygon prices</div></div>`;
    } else {
      cardsHTML = S.signals.map((s,i)=>{
        const isBuy = s.action==="BUY", cls = isBuy?"buy":"sell";
        return `<div class="signal-card ${cls}">
          <div class="signal-header">
            <div style="display:flex;align-items:center;gap:10px">
              <span class="signal-badge ${cls}">${s.action}</span>
              <span class="signal-sym mono">${s.symbol}</span>
              <span class="live-badge">LIVE</span>
            </div>
            <button class="close-btn" onclick="S.signals.splice(${i},1);render()">×</button>
          </div>
          <div class="signal-levels">
            <div class="level"><div class="level-label">Entry</div><div class="level-val mono">$${s.entry}</div></div>
            <div class="level"><div class="level-label">Target</div><div class="level-val mono" style="color:var(--green)">$${s.target}</div></div>
            <div class="level"><div class="level-label">Stop</div><div class="level-val mono" style="color:var(--red)">$${s.stopLoss}</div></div>
          </div>
          <div class="signal-reason"><span style="color:var(--yellow);font-weight:600">AI: </span>${s.reasoning}</div>
          <div class="tags">${(s.indicators||[]).map(x=>`<span class="tag">${x}</span>`).join("")}</div>
          <div class="signal-meta">
            <span>Confidence: <span class="mono" style="color:${s.confidence>75?"var(--green)":s.confidence>50?"var(--yellow)":"var(--red)"};font-weight:700">${s.confidence}%</span></span>
            <span>⏱ ${s.timeframe}</span>
            ${s.rsi?`<span>RSI: <span class="mono" style="color:${s.rsi>70?"var(--red)":s.rsi<30?"var(--green)":"var(--yellow)"}">${s.rsi}</span></span>`:""}
            ${s.macd?`<span>MACD: <span style="color:${s.macd==="Bullish"?"var(--green)":s.macd==="Bearish"?"var(--red)":"var(--yellow)"}">${s.macd}</span></span>`:""}
          </div>
        </div>`;
      }).join("") + `<div class="warning yellow">⚠️ AI signals only. Not financial advice. Always do your own research.</div>`;
      if (S.signalHistory.length) {
        cardsHTML += `<div class="section-title" style="margin-top:8px">History</div>` +
          S.signalHistory.map(s=>`<div class="trade-row">
            <span class="trade-action mono" style="color:${s.action==="BUY"?"var(--green)":"var(--red)"}">${s.action}</span>
            <span class="trade-sym mono">${s.symbol}</span>
            <span class="trade-info" style="color:var(--muted)">$${s.entry} → $${s.target}</span>
            <span style="color:var(--muted);font-size:11px">${s.ts}</span>
          </div>`).join("");
      }
    }
    sigHTML = `
      <div class="page-title">AI Trading Signals</div>
      <div class="page-sub">Live prices · Claude AI analysis</div>
      <div class="search-row">
        <input class="search-input" placeholder="e.g. 'Best tech momentum plays'..." value="${S.scanQuery}" oninput="S.scanQuery=this.value" onkeydown="if(event.key==='Enter')scanSignals()"/>
        <button class="scan-btn" onclick="scanSignals()" ${S.scanning?"disabled":""}>⚡ Scan</button>
      </div>
      ${cardsHTML}
    `;
  }

  // BOT CONTROL TAB
  let botHTML = "";
  if (S.tab==="bot") {
    botHTML = `
      <div class="page-title">Bot Control</div>
      <div class="page-sub">Start/stop the Railway trading bot remotely</div>
      <div class="bot-control" style="border:1px solid ${S.botRunning?"var(--green)":"var(--border)"}">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="bot-dot ${S.botRunning?"on":"off"}"></div>
          <div>
            <div class="bot-name">${S.botRunning?"Bot Running":"Bot Stopped"}</div>
            <div class="bot-desc">Mode: <span class="mode-badge ${S.botMode}" style="font-size:10px">${S.botMode.toUpperCase()}</span></div>
          </div>
        </div>
        <button class="bot-btn ${S.botRunning?"stop":"start"}" onclick="toggleBot()">${S.botRunning?"⏹ Stop":"▶ Start"}</button>
      </div>
      <div style="background:${S.marketOpen?"rgba(0,230,118,.08)":"rgba(255,71,87,.08)"};border:1px solid ${S.marketOpen?"rgba(0,230,118,.3)":"rgba(255,71,87,.3)"};border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:12px">
        <span style="color:${S.marketOpen?"var(--green)":"var(--red)"};font-weight:600">${S.marketOpen?"🟢 Market Open":"🔴 Market Closed"}</span>
        <span style="color:var(--muted);margin-left:8px">${S.marketReason}</span>
      </div>
      <div class="card">
        <div class="section-title">Bot Settings</div>
        <div style="font-size:13px;color:var(--muted);line-height:1.8">
          ✅ Trades 10am–3:30pm ET only<br>
          ✅ 2% account risk per trade<br>
          ✅ 1.8% automatic stop loss<br>
          ✅ Max 15% position size<br>
          ✅ Saves every trade to database<br>
          ✅ Questrade connected
        </div>
      </div>
      <div class="warning yellow">⚠️ Currently in <strong>${S.botMode.toUpperCase()}</strong> mode. To trade real money, set <span class="mono">BOT_MODE=live</span> in Railway Variables and redeploy.</div>
      <button onclick="fetchDashboard();switchTab('dashboard')" style="background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:12px;color:#fff;font-weight:700;cursor:pointer;width:100%;font-size:13px">📊 View Dashboard</button>
    `;
  }

  // MARKET SENTIMENT TAB
  let mktHTML = "";
  if (S.tab==="market") {
    const fg = S.fearGreed;
    const score = fg?.score || 50;
    const fgColor = score<25?"var(--red)":score<45?"#ff8c00":score<55?"var(--yellow)":score<75?"#90ee90":"var(--green)";
    mktHTML = `
      <div class="page-title">Market Sentiment</div>
      <div class="page-sub">AI-powered Fear & Greed meter</div>
      <div class="card">
        ${S.fgLoading?`<div class="loading"><div class="spinner"></div></div>`:`
          <div style="text-align:center;margin-bottom:8px">
            <div style="font-size:40px;font-weight:700;color:${fgColor}">${score}</div>
            <div style="font-size:16px;font-weight:700;color:${fgColor};margin-bottom:4px">${fg?.label||"—"}</div>
          </div>
          <div class="fg-meter"><div class="fg-needle" style="left:${score}%"></div></div>
          <div class="fg-labels"><span>Fear</span><span>Neutral</span><span>Greed</span></div>
          ${fg?`<div style="margin-top:12px;font-size:13px;color:var(--muted);line-height:1.6">${fg.summary}</div>`:""}
          <button onclick="loadFG()" style="margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;color:var(--text);font-size:12px;cursor:pointer;width:100%">🔄 Refresh</button>
        `}
      </div>
      <div class="card">
        <div class="section-title">Today's Movers</div>
        ${S.tickers.sort((a,b)=>Math.abs(parseFloat(b.change))-Math.abs(parseFloat(a.change))).slice(0,6).map(t=>{
          const up = parseFloat(t.change)>=0;
          return `<div class="trade-row">
            <span class="trade-sym mono">${t.symbol}</span>
            <span style="flex:1;color:var(--muted)">$${t.price}</span>
            <span style="color:${up?"var(--green)":"var(--red)"};font-weight:700">${up?"▲":"▼"}${Math.abs(t.change)}%</span>
          </div>`;
        }).join("")}
      </div>
    `;
  }

  // RISK CALC TAB
  let riskHTML = "";
  if (S.tab==="risk") {
    riskHTML = `
      <div class="page-title">Risk Calculator</div>
      <div class="page-sub">Calculate safe position size</div>
      <div class="card">
        <input class="risk-input" placeholder="Account size (e.g. 5000)" value="${S.riskAccount}" oninput="S.riskAccount=this.value;render()" type="number"/>
        <input class="risk-input" placeholder="Entry price (e.g. 150.00)" value="${S.riskEntry}" oninput="S.riskEntry=this.value;render()" type="number"/>
        <input class="risk-input" placeholder="Stop loss price (e.g. 145.00)" value="${S.riskStop}" oninput="S.riskStop=this.value;render()" type="number"/>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
          <span style="font-size:12px;color:var(--muted)">Risk %:</span>
          ${["1","2","3","5"].map(p=>`<button onclick="S.riskPct='${p}';render()" style="background:${S.riskPct===p?"var(--accent)":"var(--surface)"};color:${S.riskPct===p?"#000":"var(--text)"};border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-weight:700;font-size:12px">${p}%</button>`).join("")}
        </div>
        ${rr?`<div class="risk-result">
          <div class="risk-item"><div class="risk-label">Shares</div><div class="risk-val">${rr.shares}</div></div>
          <div class="risk-item"><div class="risk-label">Position Size</div><div class="risk-val">$${rr.size}</div></div>
          <div class="risk-item"><div class="risk-label">Max Loss</div><div class="risk-val" style="color:var(--red)">$${rr.maxLoss}</div></div>
          <div class="risk-item"><div class="risk-label">Risk/Share</div><div class="risk-val" style="color:var(--yellow)">$${rr.rps}</div></div>
        </div>`:`<div style="color:var(--muted);font-size:12px;text-align:center;padding:16px">Fill in all fields above</div>`}
      </div>
      <div class="warning yellow">⚠️ Never risk more than 1-2% per trade.</div>
    `;
  }

  document.getElementById("app").innerHTML = `
    <div class="header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div>
          <div class="logo-text mono">TRADEX AI</div>
          <div class="logo-sub"><span class="live-dot"></span>LIVE${S.lastUpdate?` · ${S.lastUpdate}`:""}</div>
        </div>
      </div>
      <div class="header-right">
        ${S.liveBalance?`
          <div class="hstat"><div class="hstat-label">Equity</div><div class="hstat-val mono">$${(S.liveBalance.total_equity||0).toFixed(2)}</div></div>
          <div class="hstat"><div class="hstat-label">P&L</div><div class="hstat-val mono" style="color:${pnlColor(S.liveStats?.stats?.total_pnl||0)}">${pnlSign(S.liveStats?.stats?.total_pnl||0)}$${Math.abs(S.liveStats?.stats?.total_pnl||0).toFixed(2)}</div></div>
        `:`<div class="hstat"><div class="hstat-label">Status</div><div class="hstat-val mono" style="color:var(--muted)">—</div></div>`}
      </div>
    </div>
    <div class="ticker-wrap"><div class="ticker-inner">${tickerHTML}</div></div>
    <div class="tabs">${tabsHTML}</div>
    <div class="content">
      ${S.tab==="dashboard"?dashHTML:""}
      ${S.tab==="signals"?sigHTML:""}
      ${S.tab==="bot"?botHTML:""}
      ${S.tab==="market"?mktHTML:""}
      ${S.tab==="risk"?riskHTML:""}
    </div>
  `;

  const lb = document.getElementById("logbox");
  if (lb) lb.scrollTop = lb.scrollHeight;
}

// ── INIT ───────────────────────────────────────────────────
fetchPrices();
fetchDashboard();
setInterval(fetchPrices, 15000);
setInterval(() => { if (S.tab==="dashboard") fetchDashboard(); }, 30000);
render();
</script>
</body>
</html>
