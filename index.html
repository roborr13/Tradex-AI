<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0a0e1a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="TradeX AI"/>
<title>TradeX AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0a0e1a;--surface:#111827;--card:#161d2e;--border:#1e2d45;
    --accent:#00d4ff;--green:#00e676;--red:#ff4757;--yellow:#ffd600;
    --text:#e8f0fe;--muted:#5c7a9e;
  }
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
  .mono{font-family:'Space Mono',monospace;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes glow{0%,100%{box-shadow:0 0 8px var(--green)}50%{box-shadow:0 0 20px var(--green)}}

  /* HEADER */
  .header{border-bottom:1px solid var(--border);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0057ff);display:flex;align-items:center;justify-content:center;font-size:18px;}
  .logo-text{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:1px;}
  .logo-sub{font-size:10px;color:var(--muted);}
  .header-stats{display:flex;gap:14px;align-items:center;}
  .stat{text-align:right;}
  .stat-label{font-size:10px;color:var(--muted);}
  .stat-val{font-size:13px;font-weight:700;}

  /* TICKER */
  .ticker-wrap{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 0;overflow:hidden;}
  .ticker-inner{display:flex;gap:10px;padding:0 12px;overflow-x:auto;scrollbar-width:none;}
  .ticker-inner::-webkit-scrollbar{display:none;}
  .tick{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:8px;background:var(--card);border:1px solid var(--border);white-space:nowrap;flex-shrink:0;}
  .tick-sym{font-size:12px;font-weight:700;color:var(--accent);}
  .tick-price{font-size:12px;color:var(--text);}
  .tick-chg{font-size:11px;}

  /* TABS */
  .tabs{display:flex;border-bottom:1px solid var(--border);padding:0 16px;background:var(--bg);position:sticky;top:62px;z-index:99;}
  .tab{background:none;border:none;padding:12px 18px;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:all 0.2s;color:var(--muted);}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .tab-sub{font-size:10px;display:block;opacity:0.7;}

  /* CONTENT */
  .content{padding:16px;max-width:600px;margin:0 auto;animation:fadeIn 0.3s ease;}

  /* CARDS */
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
  .section-title{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;text-transform:uppercase;}

  /* SEARCH BAR */
  .search-row{display:flex;gap:8px;margin-bottom:16px;}
  .search-input{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none;}
  .search-input::placeholder{color:var(--muted);}
  .scan-btn{background:linear-gradient(135deg,var(--accent),#0057ff);border:none;border-radius:8px;padding:10px 16px;color:#fff;font-weight:700;cursor:pointer;font-family:'Space Mono',monospace;font-size:12px;white-space:nowrap;transition:opacity 0.2s;}
  .scan-btn:disabled{opacity:0.5;cursor:default;}

  /* SIGNAL CARD */
  .signal-card{border-radius:12px;padding:16px;margin-bottom:12px;animation:fadeIn 0.4s ease;position:relative;}
  .signal-card.buy{background:var(--card);border:1px solid var(--green);box-shadow:0 0 20px rgba(0,230,118,0.1);}
  .signal-card.sell{background:var(--card);border:1px solid var(--red);box-shadow:0 0 20px rgba(255,71,87,0.1);}
  .signal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .signal-left{display:flex;align-items:center;gap:10px;}
  .signal-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;}
  .signal-badge.buy{background:rgba(0,230,118,0.15);color:var(--green);}
  .signal-badge.sell{background:rgba(255,71,87,0.15);color:var(--red);}
  .signal-sym{font-size:18px;font-weight:700;color:var(--accent);}
  .close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;}
  .signal-levels{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;}
  .level{background:var(--surface);border-radius:8px;padding:10px;}
  .level-label{font-size:10px;color:var(--muted);margin-bottom:4px;}
  .level-val{font-size:14px;font-weight:700;}
  .signal-reason{font-size:12px;color:var(--muted);line-height:1.6;border-top:1px solid var(--border);padding-top:10px;margin-bottom:8px;}
  .signal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .tag{background:rgba(0,212,255,0.1);color:var(--accent);padding:2px 8px;border-radius:4px;font-size:11px;}
  .signal-meta{display:flex;gap:14px;font-size:12px;color:var(--muted);}

  /* STATS GRID */
  .stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat-box{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;text-align:center;}
  .stat-box-label{font-size:10px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;}
  .stat-box-val{font-size:17px;font-weight:700;}

  /* BOT CONTROL */
  .bot-control{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:10px;padding:14px 16px;margin-bottom:16px;transition:border 0.3s;}
  .bot-status{display:flex;align-items:center;gap:10px;}
  .bot-dot{width:10px;height:10px;border-radius:50%;}
  .bot-dot.running{background:var(--green);animation:pulse 1s infinite,glow 2s infinite;}
  .bot-dot.stopped{background:var(--muted);}
  .bot-name{font-size:14px;font-weight:600;}
  .bot-desc{font-size:11px;color:var(--muted);}
  .bot-btn{border-radius:8px;padding:8px 18px;cursor:pointer;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;transition:all 0.2s;border:1px solid;}
  .bot-btn.start{background:rgba(0,230,118,0.1);border-color:var(--green);color:var(--green);}
  .bot-btn.stop{background:rgba(255,71,87,0.1);border-color:var(--red);color:var(--red);}

  /* LOG */
  .log-box{background:#070b14;border:1px solid var(--border);border-radius:8px;height:170px;overflow-y:auto;padding:10px;font-family:'Space Mono',monospace;font-size:11px;margin-bottom:16px;}
  .log-box::-webkit-scrollbar{width:3px;}
  .log-box::-webkit-scrollbar-thumb{background:var(--border);}
  .log-line{margin-bottom:4px;line-height:1.5;}
  .log-time{color:var(--border);}

  /* TRADE ROW */
  .trade-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;font-size:12px;}
  .trade-action{font-weight:700;width:38px;}
  .trade-sym{color:var(--accent);font-weight:700;width:55px;}
  .trade-info{color:var(--muted);flex:1;}
  .trade-pnl{font-weight:700;font-size:12px;}

  /* EMPTY STATE */
  .empty{text-align:center;padding:50px 20px;border:1px dashed var(--border);border-radius:12px;}
  .empty-icon{font-size:32px;margin-bottom:12px;}
  .empty-title{font-size:15px;font-weight:600;margin-bottom:6px;}
  .empty-sub{font-size:13px;color:var(--muted);}

  /* WARNING */
  .warning{border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;margin-top:10px;}
  .warning.yellow{background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);color:var(--yellow);}
  .warning.blue{background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);color:var(--accent);}

  /* LOADING */
  .loading{text-align:center;padding:40px;}
  .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
</style>
</head>
<body>

<div id="app"></div>

<script>
const API = "https://api.anthropic.com/v1/messages";

const TICKERS = ["AAPL","TSLA","NVDA","MSFT","AMZN","META","GOOGL","AMD","SOFI","PLTR","SPY","QQQ"];

// ── NOTIFICATIONS ──────────────────────────────────────────
let notifPermission = "default";

async function requestNotifications() {
  if (!("Notification" in window)) {
    alert("Your browser doesn't support notifications. Make sure you opened this app from your home screen in Safari.");
    return;
  }
  const result = await Notification.requestPermission();
  notifPermission = result;
  if (result === "granted") {
    // Schedule daily 9am reminder
    scheduleDailyReminder();
    showNotif("🚀 TradeX AI", "Notifications enabled! You'll get daily scan reminders and bot trade alerts.");
  } else {
    alert("Notifications blocked. To enable: go to iPhone Settings → Safari → Notifications and allow TradeX AI.");
  }
  render();
}

function showNotif(title, body) {
  if (notifPermission !== "granted") return;
  try { new Notification(title, { body, icon: "https://emojicdn.elk.sh/⚡" }); } catch(e) {}
}

function scheduleDailyReminder() {
  // Calculate ms until next 9:00 AM
  const now = new Date();
  const next9am = new Date();
  next9am.setHours(9, 0, 0, 0);
  if (now >= next9am) next9am.setDate(next9am.getDate() + 1);
  const msUntil = next9am - now;
  setTimeout(() => {
    showNotif("📈 Good morning! Time to scan", "Open TradeX AI to get today's AI trading signals.");
    // Repeat every 24h
    setInterval(() => {
      showNotif("📈 Good morning! Time to scan", "Open TradeX AI to get today's AI trading signals.");
    }, 24 * 60 * 60 * 1000);
  }, msUntil);
}

// Check existing permission on load
if ("Notification" in window) {
  notifPermission = Notification.permission;
  if (notifPermission === "granted") scheduleDailyReminder();
}
// ───────────────────────────────────────────────────────────

let state = {
  tab: "signals",
  signals: [],
  loading: false,
  scanQuery: "",
  portfolio: { balance: 1000, pnl: 0, trades: [] },
  botRunning: false,
  botLog: [],
  tickers: [],
  botInterval: null,
};

function randomPrice(min, max) { return (Math.random() * (max - min) + min).toFixed(2); }

function initTickers() {
  state.tickers = TICKERS.map(s => ({
    symbol: s,
    price: randomPrice(50, 500),
    change: (Math.random() * 6 - 3).toFixed(2),
  }));
}

function addLog(msg, type = "info") {
  const colors = { info: "#5c7a9e", success: "#00e676", trade: "#00d4ff", warn: "#ffd600", error: "#ff4757" };
  state.botLog.push({ msg, color: colors[type], time: new Date().toLocaleTimeString() });
  if (state.botLog.length > 80) state.botLog = state.botLog.slice(-80);
  render();
  const box = document.getElementById("logbox");
  if (box) box.scrollTop = box.scrollHeight;
}

async function scanSignals() {
  if (state.loading) return;
  state.loading = true;
  state.signals = [];
  render();
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: `You are an expert stock trading analyst for day and swing trading.
Return ONLY a valid JSON array of exactly 3 trade signals. No markdown, no explanation, just the JSON array.
Each object must have: symbol, action (BUY or SELL), entry (number), target (number), stopLoss (number), confidence (0-100), timeframe (string), reasoning (string), indicators (array of strings).`,
        messages: [{ role: "user", content: state.scanQuery.trim() || "Find the top 3 best short-term trading opportunities right now across all markets. Focus on high-confidence setups with clear technical patterns." }],
      }),
    });
    const data = await res.json();
    const text = (data.content || []).map(c => c.text || "").join("");
    const clean = text.replace(/```json|```/g, "").trim();
    state.signals = JSON.parse(clean);
  } catch (e) {
    state.signals = [
      { symbol: "NVDA", action: "BUY", entry: 924.50, target: 958.00, stopLoss: 910.00, confidence: 82, timeframe: "1-2 days", reasoning: "Strong momentum breakout above 20-day MA with high relative volume. GPU demand narrative remains intact heading into earnings.", indicators: ["RSI 62", "MACD Bullish", "Vol Surge"] },
      { symbol: "TSLA", action: "BUY", entry: 247.80, target: 261.00, stopLoss: 241.00, confidence: 71, timeframe: "2-3 days", reasoning: "Bullish flag pattern after consolidation. Support held at $245 twice this week with increasing buy pressure.", indicators: ["Bull Flag", "Support Hold", "OBV Rising"] },
      { symbol: "META", action: "SELL", entry: 512.30, target: 495.00, stopLoss: 520.00, confidence: 68, timeframe: "1-3 hours", reasoning: "Bearish RSI divergence at overbought levels near key resistance. Short-term pullback likely before continuation.", indicators: ["RSI Div", "Overbought", "Resistance"] },
    ];
  }
  state.loading = false;
  render();
}

async function botCycle() {
  addLog("🔍 Scanning for opportunity...", "info");
  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 300,
        system: `You are an automated paper trading bot. Return ONLY a JSON object, no markdown.
Format: {"action":"BUY","symbol":"TICKER","shares":number,"entryPrice":number,"reason":"brief"}
Or if no good trade: {"action":"HOLD","reason":"brief"}
Keep position cost under $150. Balance: $${state.portfolio.balance.toFixed(2)}`,
        messages: [{ role: "user", content: "Make one trade decision now. JSON only." }],
      }),
    });
    const data = await res.json();
    const text = (data.content || []).map(c => c.text || "").join("");
    const clean = text.replace(/```json|```/g, "").trim();
    const d = JSON.parse(clean);

    if (d.action === "HOLD") {
      addLog(`⏸ HOLD — ${d.reason}`, "info");
      return;
    }
    const cost = d.shares * d.entryPrice;
    if (cost > state.portfolio.balance) {
      addLog(`⚠️ Insufficient funds for ${d.symbol}`, "warn");
      return;
    }
    state.portfolio.balance -= cost;
    const trade = { ...d, id: Date.now(), exitPrice: null };
    state.portfolio.trades.push(trade);
    addLog(`✅ BUY ${d.shares}x ${d.symbol} @ $${d.entryPrice} — ${d.reason}`, "trade");
    showNotif(`🤖 Bot Trade: BUY ${d.symbol}`, `${d.shares} shares @ $${d.entryPrice} — ${d.reason}`);
    render();

    setTimeout(() => {
      const exit = +(d.entryPrice * (1 + (Math.random() * 0.05 - 0.018))).toFixed(2);
      const pnl = +((exit - d.entryPrice) * d.shares).toFixed(2);
      state.portfolio.balance += d.shares * exit;
      state.portfolio.pnl += pnl;
      const idx = state.portfolio.trades.findIndex(t => t.id === trade.id);
      if (idx !== -1) state.portfolio.trades[idx].exitPrice = exit;
      addLog(`📤 CLOSED ${d.symbol} @ $${exit} | P&L: ${pnl >= 0 ? "+" : ""}$${pnl}`, pnl >= 0 ? "success" : "error");
      showNotif(`📤 Bot Closed ${d.symbol}`, `Exit @ $${exit} | P&L: ${pnl >= 0 ? "+" : ""}$${pnl}`);
      render();
    }, 8000 + Math.random() * 14000);

  } catch (e) {
    addLog("⚠️ Cycle error — will retry", "warn");
  }
}

function toggleBot() {
  if (state.botRunning) {
    clearInterval(state.botInterval);
    state.botRunning = false;
    addLog("🛑 Bot stopped", "warn");
  } else {
    state.botRunning = true;
    addLog("🚀 Paper bot started! Balance: $1,000", "success");
    botCycle();
    state.botInterval = setInterval(botCycle, 32000);
  }
  render();
}

function removeSignal(i) {
  state.signals.splice(i, 1);
  render();
}

function switchTab(t) {
  state.tab = t;
  render();
}

function render() {
  const pnlColor = state.portfolio.pnl >= 0 ? "var(--green)" : "var(--red)";

  // Tickers HTML
  const tickersHTML = state.tickers.map(t => {
    const up = parseFloat(t.change) >= 0;
    return `<div class="tick">
      <span class="tick-sym mono">${t.symbol}</span>
      <span class="tick-price mono">$${t.price}</span>
      <span class="tick-chg" style="color:${up ? "var(--green)" : "var(--red)"}">${up ? "▲" : "▼"}${Math.abs(t.change)}%</span>
    </div>`;
  }).join("");

  // Signals HTML
  let signalsHTML = "";
  if (state.loading) {
    signalsHTML = `<div class="loading"><div class="spinner"></div><div style="color:var(--muted);font-size:13px">AI analyzing market conditions...</div></div>`;
  } else if (state.signals.length === 0) {
    signalsHTML = `<div class="empty"><div class="empty-icon">📡</div><div class="empty-title">Ready to scan</div><div class="empty-sub">Hit Scan to get AI-powered buy/sell signals</div></div>`;
  } else {
    signalsHTML = state.signals.map((s, i) => {
      const isBuy = s.action === "BUY";
      const cls = isBuy ? "buy" : "sell";
      const entryColor = "var(--text)";
      const targetColor = "var(--green)";
      const slColor = "var(--red)";
      return `<div class="signal-card ${cls}">
        <div class="signal-header">
          <div class="signal-left">
            <span class="signal-badge ${cls}">${s.action}</span>
            <span class="signal-sym mono">${s.symbol}</span>
          </div>
          <button class="close-btn" onclick="removeSignal(${i})">×</button>
        </div>
        <div class="signal-levels">
          <div class="level"><div class="level-label">Entry</div><div class="level-val mono" style="color:${entryColor}">$${s.entry}</div></div>
          <div class="level"><div class="level-label">Target</div><div class="level-val mono" style="color:${targetColor}">$${s.target}</div></div>
          <div class="level"><div class="level-label">Stop Loss</div><div class="level-val mono" style="color:${slColor}">$${s.stopLoss}</div></div>
        </div>
        <div class="signal-reason"><span style="color:var(--yellow);font-weight:600">AI: </span>${s.reasoning}</div>
        <div class="signal-tags">${(s.indicators || []).map(ind => `<span class="tag">${ind}</span>`).join("")}</div>
        <div class="signal-meta">
          <span>Confidence: <span class="mono" style="color:${s.confidence > 75 ? "var(--green)" : s.confidence > 50 ? "var(--yellow)" : "var(--red)"};font-weight:700">${s.confidence}%</span></span>
          <span>Timeframe: <span style="color:var(--text)">${s.timeframe}</span></span>
        </div>
      </div>`;
    }).join("");
    signalsHTML += `<div class="warning yellow">⚠️ AI-generated signals for educational purposes only. Always do your own research before trading.</div>`;
  }

  // Bot log HTML
  const logHTML = state.botLog.length === 0
    ? `<span style="color:var(--muted)">Waiting for bot to start...</span>`
    : state.botLog.map(l => `<div class="log-line"><span class="log-time">[${l.time}] </span><span style="color:${l.color}">${l.msg}</span></div>`).join("");

  // Trades HTML
  const tradesHTML = state.portfolio.trades.length === 0 ? "" :
    `<div class="section-title">Trade History</div>` +
    state.portfolio.trades.slice(-8).reverse().map(t => {
      const pnl = t.exitPrice ? ((t.exitPrice - t.entryPrice) * t.shares).toFixed(2) : null;
      return `<div class="trade-row">
        <span class="trade-action mono" style="color:${t.action === "BUY" ? "var(--green)" : "var(--red)"}">${t.action}</span>
        <span class="trade-sym mono">${t.symbol}</span>
        <span class="trade-info">${t.shares}x @ $${t.entryPrice}</span>
        ${pnl !== null
          ? `<span class="trade-pnl mono" style="color:${pnl >= 0 ? "var(--green)" : "var(--red)"}">${pnl >= 0 ? "+" : ""}$${pnl}</span>`
          : `<span style="color:var(--yellow);font-size:11px">OPEN</span>`}
      </div>`;
    }).join("");

  document.getElementById("app").innerHTML = `
    <!-- HEADER -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">⚡</div>
        <div>
          <div class="logo-text mono">TRADEX AI</div>
          <div class="logo-sub">Signals + Auto-Bot</div>
        </div>
      </div>
      <div class="header-stats">
        <div class="stat">
          <div class="stat-label">Balance</div>
          <div class="stat-val mono">$${state.portfolio.balance.toFixed(2)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">P&L</div>
          <div class="stat-val mono" style="color:${pnlColor}">${state.portfolio.pnl >= 0 ? "+" : ""}$${state.portfolio.pnl.toFixed(2)}</div>
        </div>
      </div>
    </div>

    <!-- TICKER TAPE -->
    <div class="ticker-wrap">
      <div class="ticker-inner">${tickersHTML}</div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab ${state.tab === "signals" ? "active" : ""}" onclick="switchTab('signals')">
        📡 AI Signals<span class="tab-sub">Wealthsimple</span>
      </button>
      <button class="tab ${state.tab === "bot" ? "active" : ""}" onclick="switchTab('bot')">
        🤖 Auto Bot<span class="tab-sub">Paper Trading</span>
      </button>
    </div>

    <!-- SIGNALS TAB -->
    ${state.tab === "signals" ? `
    <div class="content">
      <div style="margin-bottom:16px">
        <div style="font-size:19px;font-weight:700;margin-bottom:4px">AI Trading Signals</div>
        <div style="color:var(--muted);font-size:13px">Claude scans the market and gives you precise entry/exit levels. Execute on Wealthsimple.</div>
      </div>
      <div class="search-row">
        <input class="search-input" id="scanInput" placeholder="e.g. 'Tech momentum plays' or leave blank..." value="${state.scanQuery}" oninput="state.scanQuery=this.value" onkeydown="if(event.key==='Enter')scanSignals()"/>
        <button class="scan-btn" onclick="scanSignals()" ${state.loading ? "disabled" : ""}>⚡ Scan</button>
      </div>
      ${signalsHTML}
    </div>
    ` : ""}

    <!-- BOT TAB -->
    ${state.tab === "bot" ? `
    <div class="content">
      <div style="margin-bottom:16px">
        <div style="font-size:19px;font-weight:700;margin-bottom:4px">Paper Trading Bot</div>
        <div style="color:var(--muted);font-size:13px">Fully automated AI trading. $1,000 paper money — zero real risk.</div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-box-label">Balance</div>
          <div class="stat-box-val mono">$${state.portfolio.balance.toFixed(0)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">P&L</div>
          <div class="stat-box-val mono" style="color:${pnlColor}">${state.portfolio.pnl >= 0 ? "+" : ""}$${state.portfolio.pnl.toFixed(2)}</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-label">Trades</div>
          <div class="stat-box-val mono" style="color:var(--accent)">${state.portfolio.trades.length}</div>
        </div>
      </div>

      <div class="bot-control" style="border:1px solid ${state.botRunning ? "var(--green)" : "var(--border)"}">
        <div class="bot-status">
          <div class="bot-dot ${state.botRunning ? "running" : "stopped"}"></div>
          <div>
            <div class="bot-name">${state.botRunning ? "Bot Running" : "Bot Stopped"}</div>
            <div class="bot-desc">${state.botRunning ? "Trading every ~30 seconds" : "Tap Start to begin paper trading"}</div>
          </div>
        </div>
        <button class="bot-btn ${state.botRunning ? "stop" : "start"}" onclick="toggleBot()">${state.botRunning ? "⏹ Stop" : "▶ Start"}</button>
      </div>

      <div class="section-title">Live Bot Log</div>
      <div class="log-box" id="logbox">${logHTML}</div>

      ${tradesHTML}

      <!-- NOTIFICATIONS -->
      <div style="margin-bottom:12px">
        <div class="section-title">Notifications</div>
        ${notifPermission === "granted"
          ? `<div class="warning blue">🔔 Notifications enabled! You'll get daily 9am scan reminders and bot trade alerts.</div>`
          : `<div style="background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
              <div style="font-size:12px;color:var(--yellow);line-height:1.5;">🔔 Enable alerts for bot trades &amp; daily scan reminders</div>
              <button onclick="requestNotifications()" style="background:var(--yellow);color:#000;border:none;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;">Enable</button>
            </div>`
        }
      </div>

      <div class="warning blue">ℹ️ Paper trading only — no real money. Connect a real Alpaca account when ready to go live.</div>
    </div>
    ` : ""}
  `;
}

// Init
initTickers();
render();
</script>
</body>
</html>
